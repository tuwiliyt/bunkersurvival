// Underground Bunker Architecture & Room Management
class Room {
  constructor(data) {
    this.id = data.id;
    this.floor = data.floor;
    this.col = data.col;
    this.name = data.name;
    this.icon = data.icon;
    this.desc = data.desc;
    this.produces = data.produces;
    this.baseRate = data.rate || 0;
    this.cost = data.cost || null;
    this.maxWorkers = data.maxWorkers || 2;
    this.powerCost = data.powerCost || 2;
    this.level = 1;
    this.color = data.color;

    // Calculate screen bounding box
    const totalBunkerWidth = CONFIG.BUNKER_RIGHT - CONFIG.BUNKER_LEFT;
    const shaftW = CONFIG.ELEVATOR_WIDTH;
    const leftWidth = (CONFIG.ELEVATOR_X - shaftW / 2) - CONFIG.BUNKER_LEFT;
    const rightWidth = CONFIG.BUNKER_RIGHT - (CONFIG.ELEVATOR_X + shaftW / 2);
    
    const roomW = (this.col < 2) ? (leftWidth / 2) : (rightWidth / 2);
    let rx = 0;
    if (this.col === 0) rx = CONFIG.BUNKER_LEFT;
    else if (this.col === 1) rx = CONFIG.BUNKER_LEFT + roomW;
    else if (this.col === 2) rx = CONFIG.ELEVATOR_X + shaftW / 2;
    else if (this.col === 3) rx = CONFIG.ELEVATOR_X + shaftW / 2 + roomW;

    const ry = CONFIG.BUNKER_TOP + (this.floor - 1) * CONFIG.FLOOR_HEIGHT;

    this.x = rx;
    this.y = ry;
    this.width = roomW;
    this.height = CONFIG.FLOOR_HEIGHT;

    this.progress = 0; // Production progress cycle
    this.hovered = false;
  }

  upgrade() {
    const upgradeCost = this.level * 40;
    if (window.gameEngine.resources.metal >= upgradeCost) {
      window.gameEngine.resources.metal -= upgradeCost;
      this.level++;
      window.soundSystem.playBeep(true);
      window.gameEngine.particles.spawnSparks(this.x + this.width / 2, this.y + this.height / 2, 20, '#55ee88');
      window.gameEngine.particles.addFloatingText(`TIER ${this.level}!`, this.x + this.width / 2 - 25, this.y + 30, '#55ee88');
      return true;
    }
    window.soundSystem.playBeep(false);
    return false;
  }

  update(dt, workers, hasPower) {
    if (!workers || workers.length === 0 || !hasPower || !this.produces) return;

    // Production calculation
    // Tech modifiers
    let techMult = 1.0;
    if (this.produces === 'ammo' && window.gameEngine.techTree.ammoOptimization) techMult = 1.4;
    if (this.produces === 'food' && window.gameEngine.techTree.hydroBoost) techMult = 1.5;

    // Calculate sum of worker efficiencies & award work XP
    let workerEffSum = 0;
    for (const w of workers) {
      if (w.isDead) continue;
      const eff = w.getEfficiency ? w.getEfficiency() : 1.0;
      const specMult = (w.specialty === this.id) ? 1.25 : 1.0;
      workerEffSum += eff * specMult;
      if (w.addXP) {
        const xpRate = CONFIG.SURVIVOR_XP_PER_SEC_WORKING * (w.specialty === this.id ? CONFIG.SURVIVOR_XP_SPECIALTY_MULT : 1.0);
        w.addXP(xpRate * dt);
      }
    }

    const effectiveRate = this.baseRate * (1 + (this.level - 1) * 0.4) * (workerEffSum * 0.8) * techMult;

    // Check resource requirements
    let canProduce = true;
    if (this.cost) {
      for (const [resKey, amountPerSec] of Object.entries(this.cost)) {
        if (window.gameEngine.resources[resKey] < amountPerSec * dt) {
          canProduce = false;
          break;
        }
      }
    }

    if (canProduce) {
      // Consume cost
      if (this.cost) {
        for (const [resKey, amountPerSec] of Object.entries(this.cost)) {
          window.gameEngine.resources[resKey] = Math.max(0, window.gameEngine.resources[resKey] - amountPerSec * dt);
        }
      }

      // Add produced resource
      const gain = effectiveRate * dt;
      const current = window.gameEngine.resources[this.produces];
      const cap = CONFIG.RESOURCE_CAPS[this.produces] || 999;
      window.gameEngine.resources[this.produces] = Math.min(cap, current + gain);
    }
  }

  draw(ctx, isPowered, workers) {
    // Room background
    ctx.fillStyle = isPowered ? this.color : '#1f1e24';
    ctx.fillRect(this.x + 2, this.y + 2, this.width - 4, this.height - 4);

    // Wall grid patterns
    ctx.strokeStyle = 'rgba(0, 0, 0, 0.25)';
    ctx.lineWidth = 1;
    ctx.strokeRect(this.x + 6, this.y + 6, this.width - 12, this.height - 12);

    // Hover outline
    if (this.hovered) {
      ctx.strokeStyle = '#ffd700';
      ctx.lineWidth = 2;
      ctx.strokeRect(this.x + 2, this.y + 2, this.width - 4, this.height - 4);
    } else {
      ctx.strokeStyle = '#2c3e50';
      ctx.lineWidth = 2;
      ctx.strokeRect(this.x, this.y, this.width, this.height);
    }

    // Interior specific illustrations
    this.drawRoomInterior(ctx, isPowered);

    // Room Label & Tier Badge
    ctx.fillStyle = isPowered ? '#ffffff' : '#7f8c8d';
    ctx.font = 'bold 11px "Courier New", monospace';
    ctx.textAlign = 'left';
    ctx.fillText(`${this.icon} ${this.name}`, this.x + 8, this.y + 18);

    ctx.fillStyle = '#f1c40f';
    ctx.font = 'bold 9px monospace';
    ctx.fillText(`T${this.level}`, this.x + this.width - 24, this.y + 18);

    // Worker count indicator
    ctx.fillStyle = workers.length > 0 ? '#2ecc71' : '#e74c3c';
    ctx.font = '10px monospace';
    ctx.fillText(`👥 ${workers.length}/${this.maxWorkers}`, this.x + 8, this.y + this.height - 8);

    // Power icon
    if (!isPowered) {
      ctx.fillStyle = '#e74c3c';
      ctx.fillText('⚡ NO POWER', this.x + this.width - 75, this.y + this.height - 8);
    }
  }

  drawRoomInterior(ctx, isPowered) {
    const cx = this.x + this.width / 2;
    const by = this.y + this.height - 14;
    const now = Date.now();

    ctx.save();

    // Fluorescent flicker during severe power dips (< 20 PWR)
    const engine = window.gameEngine;
    if (engine && engine.resources.power < 20 && isPowered) {
      if (Math.random() < 0.12) {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.45)';
        ctx.fillRect(this.x + 2, this.y + 2, this.width - 4, this.height - 4);
      }
    }

    if (this.id === 'security') {
      // Security & Radar: Pulsing holographic radar display with sweeping beam and blips
      const monW = 54, monH = 34;
      ctx.fillStyle = '#0f1419';
      ctx.fillRect(cx - monW / 2, by - monH - 2, monW, monH);
      ctx.strokeStyle = '#2d3748';
      ctx.lineWidth = 1.5;
      ctx.strokeRect(cx - monW / 2, by - monH - 2, monW, monH);

      if (isPowered) {
        const radarCenterX = cx;
        const radarCenterY = by - monH / 2 - 2;
        const radarR = 13;

        // Concentric range rings
        ctx.strokeStyle = 'rgba(0, 255, 120, 0.35)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.arc(radarCenterX, radarCenterY, 6, 0, Math.PI * 2);
        ctx.arc(radarCenterX, radarCenterY, radarR, 0, Math.PI * 2);
        ctx.stroke();

        // Crosshairs
        ctx.beginPath();
        ctx.moveTo(radarCenterX - radarR, radarCenterY);
        ctx.lineTo(radarCenterX + radarR, radarCenterY);
        ctx.moveTo(radarCenterX, radarCenterY - radarR);
        ctx.lineTo(radarCenterX, radarCenterY + radarR);
        ctx.stroke();

        // Rotating radar sweep arm
        const sweepAngle = (now / 450) % (Math.PI * 2);
        ctx.strokeStyle = '#00ff88';
        ctx.shadowColor = '#00ff88';
        ctx.shadowBlur = 5;
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(radarCenterX, radarCenterY);
        ctx.lineTo(radarCenterX + Math.cos(sweepAngle) * radarR, radarCenterY + Math.sin(sweepAngle) * radarR);
        ctx.stroke();

        // Trailing radar sweep wedge
        ctx.fillStyle = 'rgba(0, 255, 136, 0.15)';
        ctx.beginPath();
        ctx.moveTo(radarCenterX, radarCenterY);
        ctx.arc(radarCenterX, radarCenterY, radarR, sweepAngle - 0.55, sweepAngle);
        ctx.closePath();
        ctx.fill();

        // Zombie threat blips (simulated or real from engine)
        const blipBlink = Math.sin(now / 120) > 0;
        if (blipBlink) {
          ctx.fillStyle = engine && engine.waveManager.isHordeActive ? '#ff2222' : '#f1c40f';
          ctx.shadowColor = ctx.fillStyle;
          ctx.shadowBlur = 6;
          ctx.beginPath();
          ctx.arc(radarCenterX - 7, radarCenterY - 4, 1.8, 0, Math.PI * 2);
          ctx.arc(radarCenterX + 8, radarCenterY + 5, 1.5, 0, Math.PI * 2);
          ctx.fill();
        }

        // Telemetry readout at bottom of monitor
        ctx.fillStyle = '#00e5ff';
        ctx.font = '7px monospace';
        ctx.fillText('RADAR SCAN', cx - 20, by - monH + 7);
      }
    } else if (this.id === 'gunpowder_lab') {
      // Chemical & Gunpowder Lab: Bubbling glass flasks, Bunsen burner, and distillation tubes
      ctx.fillStyle = '#3a2512';
      ctx.fillRect(cx - 32, by - 10, 64, 10); // Lab wooden bench

      if (isPowered) {
        // Bunsen Burner
        ctx.fillStyle = '#718096';
        ctx.fillRect(cx - 18, by - 16, 6, 6);
        // Animated flickering blue flame
        const flameH = 4 + Math.sin(now / 40) * 1.5;
        ctx.fillStyle = '#00d2d3';
        ctx.shadowColor = '#00d2d3';
        ctx.shadowBlur = 6;
        ctx.beginPath();
        ctx.moveTo(cx - 18, by - 16);
        ctx.lineTo(cx - 15, by - 16 - flameH);
        ctx.lineTo(cx - 12, by - 16);
        ctx.closePath();
        ctx.fill();

        // Flask 1 (Erlenmeyer Flask with bubbling sulfur yellow liquid)
        ctx.strokeStyle = '#a0aec0';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(cx - 20, by - 18);
        ctx.lineTo(cx - 22, by - 28);
        ctx.lineTo(cx - 17, by - 36);
        ctx.lineTo(cx - 13, by - 36);
        ctx.lineTo(cx - 8, by - 28);
        ctx.lineTo(cx - 10, by - 18);
        ctx.closePath();
        ctx.stroke();

        // Amber/Yellow bubbling liquid inside Flask 1
        ctx.fillStyle = '#f39c12';
        ctx.beginPath();
        ctx.moveTo(cx - 20, by - 19);
        ctx.lineTo(cx - 21, by - 26);
        ctx.lineTo(cx - 9, by - 26);
        ctx.lineTo(cx - 10, by - 19);
        ctx.closePath();
        ctx.fill();

        // Rising bubbles in Flask 1
        const b1 = (now / 70) % 7;
        const b2 = (now / 90 + 3) % 7;
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(cx - 16, by - 20 - b1, 1.2, 0, Math.PI * 2);
        ctx.arc(cx - 13, by - 20 - b2, 1.0, 0, Math.PI * 2);
        ctx.fill();

        // Distillation glass tubing connecting to Flask 2
        ctx.strokeStyle = 'rgba(200, 230, 255, 0.75)';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(cx - 15, by - 36);
        ctx.lineTo(cx - 15, by - 40);
        ctx.lineTo(cx + 10, by - 40);
        ctx.lineTo(cx + 10, by - 30);
        ctx.stroke();

        // Flask 2 (Spherical Flask with violet liquid)
        ctx.strokeStyle = '#a0aec0';
        ctx.beginPath();
        ctx.arc(cx + 10, by - 22, 8, 0, Math.PI * 2);
        ctx.stroke();
        ctx.fillStyle = '#8e44ad';
        ctx.beginPath();
        ctx.arc(cx + 10, by - 22, 7, 0, Math.PI);
        ctx.fill();

        // Bubbles in Flask 2
        const b3 = (now / 80) % 6;
        ctx.fillStyle = '#dda0dd';
        ctx.beginPath();
        ctx.arc(cx + 8, by - 21 - b3, 1.2, 0, Math.PI * 2);
        ctx.arc(cx + 12, by - 19 - ((b3 + 3) % 6), 1.0, 0, Math.PI * 2);
        ctx.fill();

        // Mortar & Pestle with sulfur powder
        ctx.fillStyle = '#4a5568';
        ctx.beginPath();
        ctx.arc(cx + 24, by - 14, 5, 0, Math.PI);
        ctx.fill();

// Elevator Shaft & Lift Car
class Elevator {
  constructor() {
    this.x = CONFIG.ELEVATOR_X;
    this.width = CONFIG.ELEVATOR_WIDTH;
    this.cabinHeight = 44;
    this.topY = CONFIG.SURFACE_Y - this.cabinHeight;
    this.bottomY = CONFIG.BUNKER_TOP + CONFIG.FLOORS_COUNT * CONFIG.FLOOR_HEIGHT;
    this.targetFloor = 0;
    this.currentFloor = 0;
    this.carY = this.getFloorCarY(0);
    this.targetY = this.carY;
    this.speed = 135; // px/s
    this.passengers = [];
  }

  getFloorWalkY(floorIndex) {
    if (floorIndex === 0) return CONFIG.SURFACE_Y;
    return CONFIG.BUNKER_TOP + (floorIndex - 1) * CONFIG.FLOOR_HEIGHT + CONFIG.FLOOR_HEIGHT - 12;
  }

  getFloorCarY(floorIndex) {
    return this.getFloorWalkY(floorIndex) - (this.cabinHeight - 4);
  }

  moveToFloor(floorIndex) {
    this.targetFloor = Math.max(0, Math.min(CONFIG.FLOORS_COUNT, floorIndex));
    this.targetY = this.getFloorCarY(this.targetFloor);
  }

  isAtFloor(floorIndex) {
    return Math.abs(this.carY - this.getFloorCarY(floorIndex)) < 3.0;
  }

  board(survivor) {
    if (!this.passengers.includes(survivor)) {
      this.passengers.push(survivor);
      survivor.inElevator = true;
    }
  }

  exit(survivor) {
    const idx = this.passengers.indexOf(survivor);
    if (idx !== -1) {
      this.passengers.splice(idx, 1);
      survivor.inElevator = false;
    }
  }

  update(dt) {
    const diff = this.targetY - this.carY;
    const step = this.speed * dt;
    if (Math.abs(diff) <= Math.max(1.5, step)) {
      const arrivedAtNewFloor = this.currentFloor !== this.targetFloor;
      this.carY = this.targetY;
      this.currentFloor = this.targetFloor;
      if (arrivedAtNewFloor && window.soundSystem) window.soundSystem.playElevatorDing();
    } else {
      this.carY += Math.sign(diff) * step;
    }

    // Keep all passenger coordinates matched to elevator cabin
    const cabinFloorY = this.carY + this.cabinHeight - 4;
    for (let i = 0; i < this.passengers.length; i++) {
      const p = this.passengers[i];
      const offset = (i - (this.passengers.length - 1) / 2) * 10;
      p.x = this.x + offset;
      p.y = cabinFloorY;
      p.targetX = p.x;
      p.targetY = p.y;
    }
  }

  draw(ctx) {
    const shaftX = this.x - this.width / 2;
    const totalHeight = this.bottomY - this.topY;

    // Shaft background (dark concrete shaft)
    ctx.fillStyle = '#181b20';
    ctx.fillRect(shaftX, this.topY, this.width, totalHeight);

    // Vertical steel guide rails
    ctx.strokeStyle = '#4a5568';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(shaftX + 4, this.topY);
    ctx.lineTo(shaftX + 4, this.bottomY);
    ctx.moveTo(shaftX + this.width - 4, this.topY);
    ctx.lineTo(shaftX + this.width - 4, this.bottomY);
    ctx.stroke();

    // Steel cables from top to elevator car
    ctx.strokeStyle = '#718096';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(this.x, this.topY);
    ctx.lineTo(this.x, this.carY);
    ctx.stroke();

    // Elevator Cabin / Car
    const carX = shaftX + 3;
    const carW = this.width - 6;
    ctx.fillStyle = '#2d3748';
    ctx.fillRect(carX, this.carY, carW, this.cabinHeight);

    // Metal grille frame
    ctx.strokeStyle = this.passengers.length > 0 ? '#48dbfb' : '#ecc94b';
    ctx.lineWidth = 1.5;
    ctx.strokeRect(carX, this.carY, carW, this.cabinHeight);

    // Interior cabin light
    ctx.fillStyle = this.passengers.length > 0 ? '#00d2d3' : '#faf089';
    ctx.beginPath();
    ctx.arc(this.x, this.carY + 6, 3, 0, Math.PI * 2);
    ctx.fill();

    // Floor indicators in shaft
    for (let f = 1; f <= CONFIG.FLOORS_COUNT; f++) {
      const fy = CONFIG.BUNKER_TOP + (f - 1) * CONFIG.FLOOR_HEIGHT;
      ctx.fillStyle = '#a0aec0';
      ctx.font = 'bold 9px monospace';
      ctx.fillText(`F${f}`, shaftX + 8, fy + 14);
    }
  }
}

// Survivor Inhabitants Management System with Autonomous Needs, XP Progression, and Ammo Logistics
class Survivor {
  constructor(data) {
    this.id = data.id;
    this.name = data.name;
    this.role = data.role;
    this.skill = data.skill;
    this.avatar = data.avatar;
    this.specialty = data.specialty || 'armory';

    this.hp = data.hp || 100;
    this.maxHp = data.maxHp || 100;
    this.hunger = data.hunger || 90;
    this.thirst = data.thirst || 90;
    this.fatigue = data.fatigue || 0;
    this.morale = data.morale || 90;

    // Progression & Skill Levels (1 to 5)
    this.level = data.level || 1;
    this.xp = data.xp || 0;
    this.xpToNext = this.getXpNeeded(this.level);

    this.assignedRoom = data.assignedRoom || 'armory';
    this.status = 'working'; // 'working', 'seeking_food', 'seeking_water', 'resting', 'delivering_ammo'

    // Visual & kinematic position
    this.x = 640;
    this.y = 350;
    this.targetX = 640;
    this.targetY = 350;
    this.speed = 52; // px/s
    this.walkCycle = Math.random() * 10;
    this.isDead = false;

    // Subsystem flags
    this.inElevator = false;
    this.carryingAmmo = false;
    this.ammoDeliveryTask = null; // Logistics runner state machine
    this.needState = null;        // 'seeking_food', 'seeking_water', 'resting'
    this.needTimer = 0;

    // Speech / status bubble
    this.speechText = '';
    this.speechTimer = 0;

    this.initPosition();
  }

  getXpNeeded(lvl) {
    const table = [100, 250, 450, 700, 1000];
    return table[Math.min(table.length - 1, lvl - 1)] || 1000;
  }

  getEfficiency() {
    // Level 1: 1.0x, Level 2: 1.25x, Level 3: 1.50x, Level 4: 1.75x, Level 5: 2.0x (+100%)
    return 1.0 + (this.level - 1) * 0.25;
  }

  addXP(amount) {
    if (this.isDead || this.level >= CONFIG.SURVIVOR_MAX_LEVEL) return;
    this.xp += amount;
    if (this.xp >= this.xpToNext) {
      this.xp -= this.xpToNext;
      this.level++;
      this.xpToNext = this.getXpNeeded(this.level);
      const title = CONFIG.SURVIVOR_LEVEL_TITLES[this.level - 1] || 'Veteran';
      this.say(`⭐ PROMOTED TO LVL ${this.level}!`, 3.5);
      if (window.gameEngine) {
        window.gameEngine.particles.spawnSparks(this.x, this.y - 20, 25, '#ffd700');
        window.gameEngine.particles.addFloatingText(`⭐ LEVEL ${this.level} ${title.toUpperCase()}!`, this.x - 30, this.y - 35, '#ffd700');
        window.gameEngine.addNotification(`⭐ ${this.name} reached Level ${this.level} ${title} ${this.role}! (+${(this.level - 1) * 25}% efficiency)`, 'success');
      }
      if (window.soundSystem) window.soundSystem.playBeep(true);
    }
  }

  initPosition() {
    const room = window.gameEngine ? window.gameEngine.getRoom(this.assignedRoom) : null;
    if (room) {
      this.x = room.x + 20 + Math.random() * (room.width - 40);
      this.y = room.y + room.height - 12;
      this.targetX = this.x;
      this.targetY = this.y;
    }
  }

  say(text, duration = 3) {
    this.speechText = text;
    this.speechTimer = duration;
  }

  assignTo(roomId) {
    this.assignedRoom = roomId;
    const room = window.gameEngine.getRoom(roomId);
    if (room) {
      this.targetX = room.x + 20 + Math.random() * (room.width - 40);
      this.targetY = room.y + room.height - 12;
      this.say(`Assigned to ${room.name}!`, 2);
    }
  }

  // Autonomous Ammo Logistics Runner Task
  startAmmoDelivery(turret) {
    if (this.ammoDeliveryTask || this.isDead) return false;
    this.ammoDeliveryTask = {
      turret: turret,
      phase: 'to_armory',
      targetFloor: 1
    };
    this.status = 'delivering_ammo';
    this.needState = null;
    this.say(`Turret low! Fetching ammo crate!`, 2.5);
    return true;
  }

  abortAmmoDelivery() {
    if (this.ammoDeliveryTask) {
      if (this.inElevator && window.gameEngine && window.gameEngine.elevator) {
        window.gameEngine.elevator.exit(this);
      }
      this.ammoDeliveryTask = null;
      this.carryingAmmo = false;
      this.status = 'working';
      this.assignTo(this.assignedRoom);
    }
  }

  update(dt) {
    if (this.isDead) return;

    if (this.speechTimer > 0) {
      this.speechTimer -= dt;
      if (this.speechTimer <= 0) this.speechText = '';
    }

    const engine = window.gameEngine;
    const res = engine.resources;
    const elevator = engine.elevator;

    // 1. Natural Needs Depletion
    this.thirst -= CONFIG.SURVIVOR_THIRST_RATE * dt;
    this.hunger -= CONFIG.SURVIVOR_HUNGER_RATE * dt;

    if (this.status === 'resting' || (this.assignedRoom && this.assignedRoom.startsWith('quarters'))) {
      this.fatigue = Math.max(0, this.fatigue - dt * 12.0);
      if (this.hp < this.maxHp) {
        this.hp = Math.min(this.maxHp, this.hp + dt * 4.0);
      }
    } else {
      this.fatigue = Math.min(100, this.fatigue + CONFIG.SURVIVOR_FATIGUE_RATE * dt);
    }

    // Starvation / Dehydration penalties
    if (this.hunger <= 0 || this.thirst <= 0) {
      this.hp -= dt * 2.5;
      if (Math.random() < 0.03 && !this.speechText) {
        this.say(this.thirst <= 0 ? "Need water desperately!" : "Starving!", 2);
      }
    }

    // Death check
    if (this.hp <= 0) {
      this.hp = 0;
      this.isDead = true;
      if (this.inElevator) elevator.exit(this);
      engine.addNotification(`💀 Survivor ${this.name} perished!`, 'danger');
      engine.particles.spawnBlood(this.x, this.y, 18, '#881111');
      return;
    }

    // 2. Ammo Delivery Task Execution (Highest priority autonomous job)
    if (this.ammoDeliveryTask) {
      this.updateAmmoDelivery(dt);
      this.performMovement(dt);
      return;
    }

    // 3. Autonomous Needs Routing
    this.updateAutonomousNeeds(dt);

    // 4. Movement towards target
    this.performMovement(dt);
  }

  updateAmmoDelivery(dt) {
    const engine = window.gameEngine;
    const elevator = engine.elevator;
    const task = this.ammoDeliveryTask;
    const turret = task.turret;
    const armory = engine.getRoom('armory');

    if (!armory) {
      this.abortAmmoDelivery();
      return;
    }

    const armoryWalkY = elevator.getFloorWalkY(1);

    if (task.phase === 'to_armory') {
      // Walk to armory crafting bench
      this.targetX = armory.x + armory.width / 2;
      this.targetY = armoryWalkY;

      // When arrived at armory
      if (Math.hypot(this.x - this.targetX, this.y - this.targetY) < 12) {
        if (engine.resources.ammo < 1) {
          this.say("No ammo in armory stock to deliver!", 2);
          this.abortAmmoDelivery();
          return;
        }
        this.carryingAmmo = true;
        task.phase = 'call_elevator_armory';
        this.say("Ammo crate ready! Calling elevator!", 2);
      }
    } else if (task.phase === 'call_elevator_armory') {
      // Walk to elevator shaft on Floor 1
      this.targetX = CONFIG.ELEVATOR_X - 16;
      this.targetY = armoryWalkY;

      if (Math.abs(this.x - this.targetX) < 10) {
        if (elevator.isAtFloor(1)) {
          elevator.board(this);
          elevator.moveToFloor(0); // Ride to surface
          task.phase = 'riding_to_surface';
          this.say("Taking lift to surface...", 2);
        } else {
          elevator.moveToFloor(1);
        }
      }
    } else if (task.phase === 'riding_to_surface') {
      // In elevator car moving up
      if (elevator.isAtFloor(0)) {
        elevator.exit(this);
        this.x = CONFIG.ELEVATOR_X;
        this.y = CONFIG.SURFACE_Y;
        task.phase = 'running_to_turret';
        this.say("Surface breached! Running to turret!", 2);
      }
    } else if (task.phase === 'running_to_turret') {
      // Walk across surface to turret
      const turretStopX = turret.side === 'left' ? turret.x + 24 : turret.x - 24;
      this.targetX = turretStopX;
      this.targetY = CONFIG.SURFACE_Y;

      if (Math.abs(this.x - turretStopX) < 14) {
        // Restock turret!
        const needed = turret.stats.maxAmmo - turret.ammo;
        const available = Math.floor(engine.resources.ammo);
        const deliverAmount = Math.min(needed, Math.min(CONFIG.AMMO_CRATE_DELIVERY_AMOUNT, available));

        if (deliverAmount > 0) {
          engine.resources.ammo -= deliverAmount;
          turret.ammo += deliverAmount;
          turret.isReloading = false;
          engine.particles.spawnSparks(turret.x, turret.y, 22, '#55ffaa');
          engine.particles.addFloatingText(`+${deliverAmount} AMMO RESTOCKED!`, turret.x - 25, turret.y - 30, '#55ffaa');
          if (window.soundSystem) window.soundSystem.playReload();
        }

        this.carryingAmmo = false;
        this.addXP(CONFIG.SURVIVOR_XP_AMMO_RUN);
        task.phase = 'returning_to_cabin';
        this.say("Restocked! Returning to bunker!", 2);
      }
    } else if (task.phase === 'returning_to_cabin') {
      // Run back into surface cabin
      this.targetX = CONFIG.ELEVATOR_X;
      this.targetY = CONFIG.SURFACE_Y;

      if (Math.abs(this.x - CONFIG.ELEVATOR_X) < 10) {
        if (elevator.isAtFloor(0)) {
          elevator.board(this);
          const assignedRoom = engine.getRoom(this.assignedRoom);
          const destFloor = assignedRoom ? assignedRoom.floor : 1;
          elevator.moveToFloor(destFloor);
          task.destFloor = destFloor;
          task.phase = 'riding_to_bunker';
          this.say("Descending back to bunker...", 2);
        } else {
          elevator.moveToFloor(0);
        }
      }
    } else if (task.phase === 'riding_to_bunker') {
      // In elevator car moving down
      if (elevator.isAtFloor(task.destFloor)) {
        elevator.exit(this);
        this.x = CONFIG.ELEVATOR_X;
        this.y = elevator.getFloorWalkY(task.destFloor);
        this.ammoDeliveryTask = null;
        this.status = 'working';
        this.assignTo(this.assignedRoom);
        this.say("Safe inside! Back to duty!", 2);
      }
    }
  }

  updateAutonomousNeeds(dt) {
    const engine = window.gameEngine;
    const res = engine.resources;
    const elevator = engine.elevator;

    // Trigger needs if thresholds crossed
    if (!this.needState) {
      if (this.thirst < CONFIG.THIRST_THRESHOLD && res.water >= 1) {
        this.needState = 'seeking_water';
        this.status = 'seeking_water';
        this.needTimer = 0;
        this.say("Thirsty... heading to filtration.", 2);
      } else if (this.hunger < CONFIG.HUNGER_THRESHOLD && res.food >= 1) {
        this.needState = 'seeking_food';
        this.status = 'seeking_food';
        this.needTimer = 0;
        this.say("Hungry... heading to Mess Hall.", 2);
      } else if (this.fatigue >= CONFIG.FATIGUE_REST_THRESHOLD) {
        this.needState = 'resting';
        this.status = 'resting';
        this.needTimer = 0;
        this.say("Exhausted... rotating to Quarters.", 2);
      }
    }

    // Process active need state
    if (this.needState === 'seeking_water') {
      const waterRoom = engine.getRoom('water_filter');
      if (waterRoom) {
        const destY = elevator.getFloorWalkY(waterRoom.floor);
        this.targetX = waterRoom.x + 30;
        this.targetY = destY;

        if (Math.hypot(this.x - this.targetX, this.y - this.targetY) < 14) {
          this.needTimer += dt;
          if (this.needTimer >= 1.5) {
            res.water = Math.max(0, res.water - 1);
            this.thirst = 100;
            this.needState = null;
            this.status = 'working';
            this.needTimer = 0;
            this.say("Refreshed with clean water!", 2);
            this.assignTo(this.assignedRoom);
          }
        }
      }
    } else if (this.needState === 'seeking_food') {
      const kitchen = engine.getRoom('kitchen');
      if (kitchen) {
        const destY = elevator.getFloorWalkY(kitchen.floor);
        this.targetX = kitchen.x + 30;
        this.targetY = destY;

        if (Math.hypot(this.x - this.targetX, this.y - this.targetY) < 14) {
          this.needTimer += dt;
          if (this.needTimer >= 1.8) {
            res.food = Math.max(0, res.food - 1);
            this.hunger = 100;
            this.needState = null;
            this.status = 'working';
            this.needTimer = 0;
            this.say("Good hot meal!", 2);
            this.assignTo(this.assignedRoom);
          }
        }
      }
    } else if (this.needState === 'resting') {
      // Find quarters
      const q = engine.getRoom('quarters_1') || engine.getRoom('quarters_2');
      if (q) {
        const destY = elevator.getFloorWalkY(q.floor);
        this.targetX = q.x + 35;
        this.targetY = destY;

        if (Math.hypot(this.x - this.targetX, this.y - this.targetY) < 16) {
          // Resting restores fatigue rapidly
          if (this.fatigue <= CONFIG.FATIGUE_WAKE_THRESHOLD) {
            this.needState = null;
            this.status = 'working';
            this.say("Fully rested and energized!", 2);
            this.assignTo(this.assignedRoom);
          }
        }
      }
    } else {
      // Normal idle pacing in assigned room
      const room = engine.getRoom(this.assignedRoom);
      if (room) {
        if (Math.random() < 0.015) {
          this.targetX = room.x + 18 + Math.random() * (room.width - 36);
          this.targetY = room.y + room.height - 12;
        }
      }
    }
  }

  performMovement(dt) {
    if (this.inElevator) return;

    const dx = this.targetX - this.x;
    const dy = this.targetY - this.y;
    const dist = Math.hypot(dx, dy);
    const step = this.speed * dt;

    if (dist <= Math.max(1.5, step)) {
      this.x = this.targetX;
      this.y = this.targetY;
    } else {
      this.x += (dx / dist) * step;
      this.y += (dy / dist) * step;
      this.walkCycle += dt * 8;
    }
  }

  draw(ctx) {
    if (this.isDead) return;

    ctx.save();
    ctx.translate(this.x, this.y);

    const bob = Math.sin(this.walkCycle) * 1.5;
    const legSwing = Math.cos(this.walkCycle) * 3;

    // Direction flip
    const movingLeft = this.targetX < this.x - 2;
    if (movingLeft) ctx.scale(-1, 1);

    // Legs
    ctx.strokeStyle = '#1e272e';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(-2, -6);
    ctx.lineTo(-3 + legSwing, 0);
    ctx.moveTo(2, -6);
    ctx.lineTo(3 - legSwing, 0);
    ctx.stroke();

    // Body / Jumpsuit
    ctx.fillStyle = this.specialty === 'armory' ? '#d35400' :
                    this.specialty === 'clinic' ? '#27ae60' :
                    this.specialty === 'workshop' ? '#f39c12' : '#2980b9';
    ctx.fillRect(-4, -16 + bob, 8, 10);

    // Head
    ctx.fillStyle = '#ffdfba';
    ctx.beginPath();
    ctx.arc(0, -19 + bob, 4, 0, Math.PI * 2);
    ctx.fill();

    // Hair / Cap
    ctx.fillStyle = '#4a2810';
    ctx.beginPath();
    ctx.arc(0, -21 + bob, 4, Math.PI, 0);
    ctx.fill();

    // Carrying Ammo Crate in hands!
    if (this.carryingAmmo) {
      // Olive green heavy munitions box with yellow text
      ctx.fillStyle = '#2d4726';
      ctx.fillRect(4, -15 + bob, 11, 7);
      ctx.strokeStyle = '#ffd700';
      ctx.lineWidth = 1;
      ctx.strokeRect(4, -15 + bob, 11, 7);
      // Yellow ammo stencil
      ctx.fillStyle = '#ffd700';
      ctx.font = 'bold 5px monospace';
      ctx.fillText('AMMO', 5, -10 + bob);
    }

    // Health pip
    const hpRatio = Math.max(0, this.hp / this.maxHp);
    ctx.fillStyle = hpRatio > 0.5 ? '#2ecc71' : '#e74c3c';
    ctx.fillRect(-6, -26 + bob, 12 * hpRatio, 2);

    // Name tag & Level Star
    ctx.fillStyle = '#ffffff';
    ctx.font = '8px monospace';
    ctx.textAlign = 'center';
    const shortName = this.name.split(' ')[0];
    ctx.fillText(`${shortName} [L${this.level}]`, 0, -29 + bob);

    // Speech bubble if speaking
    if (this.speechText) {
      ctx.save();
      if (movingLeft) ctx.scale(-1, 1); // unflip text
      ctx.fillStyle = 'rgba(0, 0, 0, 0.88)';
      ctx.font = 'bold 8px monospace';
      const textW = ctx.measureText(this.speechText).width + 8;
      ctx.fillRect(-textW / 2, -44 + bob, textW, 12);
      ctx.strokeStyle = '#ffd700';
      ctx.lineWidth = 1;
      ctx.strokeRect(-textW / 2, -44 + bob, textW, 12);
      ctx.fillStyle = '#ffd700';
      ctx.fillText(this.speechText, 0, -35 + bob);
      ctx.restore();
    }

    ctx.restore();
  }
}

// --- engine.js ---
// Core Game Engine & Surface/Bunker Canvas Renderer
class GameEngine {
  constructor(canvas) {
    this.canvas = canvas;
    this.ctx = canvas.getContext('2d');
    
    // Set internal resolution
    this.canvas.width = CONFIG.CANVAS_WIDTH;
    this.canvas.height = CONFIG.CANVAS_HEIGHT;

    // Game state
    this.timeScale = 1.0;
    this.isPaused = false;
    this.gameTime = 0; // seconds
    this.dayTime = 8.0; // Starts at 08:00 AM (Day 1)
    this.dayNumber = 1;

    // House Barricade
    this.houseHp = 500;
    this.houseMaxHp = 500;

    // Resources
    this.resources = { ...CONFIG.INITIAL_RESOURCES };

    // Tech Research Tree
    this.techTree = {
      autoConduit: false,       // Auto supplies ammo to turrets
      heavyCaliber: false,      // +30% turret damage
      ammoOptimization: false,  // +40% ammo output in Armory
      hydroBoost: false,        // +50% food output
      fortifiedWalls: false,    // Barricade max HP 1000
      longRangeRadar: false     // Extended horde warning
    };

    // Subsystems
    this.particles = new ParticleSystem();
    this.elevator = new Elevator();
    this.waveManager = new WaveManager();

    // Turrets flanking the house (Based on the diagram)
    this.leftTurret = new Turret('left', 435, CONFIG.SURFACE_Y - 10);
    this.rightTurret = new Turret('right', 845, CONFIG.SURFACE_Y - 10);

    // Atmospheric cabin searchlights mounted on surface house roof (track zombies & sweep forest)
    this.searchlights = {
      left: {
        x: 588,
        y: CONFIG.SURFACE_Y - 96,
        angle: Math.PI * 0.85,
        targetAngle: Math.PI * 0.85,
        target: null,
        sweepPhase: 0,
        range: 520
      },
      right: {
        x: 692,
        y: CONFIG.SURFACE_Y - 96,
        angle: Math.PI * 0.15,
        targetAngle: Math.PI * 0.15,
        target: null,
        sweepPhase: Math.PI,
        range: 520
      }
    };

    // Initialize Bunker Rooms
    this.rooms = CONFIG.ROOM_TEMPLATES.map(t => new Room(t));

    // Initialize Survivors
    this.survivors = CONFIG.INITIAL_SURVIVORS.map(s => new Survivor(s));

    // Zombies
    this.zombies = [];

    // Notifications
    this.notifications = [];

    // Stats
    this.stats = {
      zombiesKilled: 0,
      ammoCrafted: 0,
      daysSurvived: 1
    };

    // Input state
    this.mouseX = 0;
    this.mouseY = 0;
    this.selectedRoom = null;
    this.selectedTurret = null;
    this.manualAim = false;
    this.isMouseDown = false;

    // Bind event listeners
    this.initInputs();

    this.lastTimestamp = performance.now();
    this.running = true;
  }

  getRoom(roomId) {
    return this.rooms.find(r => r.id === roomId);
  }

  addNotification(text, type = 'info') {
    this.notifications.unshift({ text, type, life: 4.5 });
    if (this.notifications.length > 5) this.notifications.pop();
  }

  damageHouse(amount) {
    this.houseHp = Math.max(0, this.houseHp - amount);
    this.particles.spawnSparks(640, CONFIG.SURFACE_Y - 20, 10, '#ff4444');
    if (this.houseHp <= 0) {
      this.triggerGameOver("The surface house barricade was breached! Zombies overran the bunker.");
    }
  }

  repairHouse() {
    if (this.houseHp < this.houseMaxHp && this.resources.metal >= 15) {
      this.resources.metal -= 15;
      this.houseHp = Math.min(this.houseMaxHp, this.houseHp + 80);
      window.soundSystem.playBeep(true);
      this.particles.spawnSparks(640, CONFIG.SURFACE_Y - 25, 20, '#55ffaa');
      this.particles.addFloatingText("+80 HP REPAIRED", 640, CONFIG.SURFACE_Y - 40, '#55ffaa');
      return true;
    }
    return false;
  }

  triggerGameOver(reason) {
    this.isPaused = true;
    if (window.uiManager) {
      window.uiManager.showGameOver(reason);
    }
  }

  initInputs() {
    this.canvas.addEventListener('mousemove', (e) => {
      const rect = this.canvas.getBoundingClientRect();
      const scaleX = this.canvas.width / rect.width;
      const scaleY = this.canvas.height / rect.height;
      this.mouseX = (e.clientX - rect.left) * scaleX;
      this.mouseY = (e.clientY - rect.top) * scaleY;

      // Check room hover
      for (const room of this.rooms) {
        room.hovered = (
          this.mouseX >= room.x && this.mouseX <= room.x + room.width &&
          this.mouseY >= room.y && this.mouseY <= room.y + room.height
        );
      }
    });

    this.canvas.addEventListener('mousedown', (e) => {
      if (e.button === 0) {
        this.isMouseDown = true;
        window.soundSystem.ensureContext();
        if (this.manualAim && this.mouseY <= CONFIG.SURFACE_Y + 50) {
          const activeTurret = this.mouseX < 640 ? this.leftTurret : this.rightTurret;
          activeTurret.fireManual(this.mouseX, this.mouseY);
        }
      }
    });

    window.addEventListener('mouseup', (e) => {
      if (e.button === 0) {
        this.isMouseDown = false;
      }
    });

    this.canvas.addEventListener('click', (e) => {
      window.soundSystem.ensureContext();

      // If manual aim is active and player clicked surface area, ignore menu clicks
      if (this.manualAim && this.mouseY <= CONFIG.SURFACE_Y + 50) {
        return;
      }

      // Check turret clicks
      const distL = Math.hypot(this.mouseX - this.leftTurret.x, this.mouseY - this.leftTurret.y);
      if (distL < 35) {
        if (window.uiManager) window.uiManager.openTurretModal(this.leftTurret);
        return;
      }

      const distR = Math.hypot(this.mouseX - this.rightTurret.x, this.mouseY - this.rightTurret.y);
      if (distR < 35) {
        if (window.uiManager) window.uiManager.openTurretModal(this.rightTurret);
        return;
      }

      // Check room clicks
      for (const room of this.rooms) {
        if (
          this.mouseX >= room.x && this.mouseX <= room.x + room.width &&
          this.mouseY >= room.y && this.mouseY <= room.y + room.height
        ) {
          window.soundSystem.playBeep(true);
          if (window.uiManager) window.uiManager.openRoomModal(room);
          return;
        }
      }

      // Check house click (repair)
      if (
        this.mouseX >= 580 && this.mouseX <= 700 &&
        this.mouseY >= 150 && this.mouseY <= CONFIG.SURFACE_Y
      ) {
        this.repairHouse();
      }
    });
  }

  update(dt) {
    if (this.isPaused) return;

    // Apply timescale
    const effectiveDt = dt * this.timeScale;
    this.gameTime += effectiveDt;

    // Update Day/Night clock (1 in-game day = 180 real seconds)
    this.dayTime += (effectiveDt / 180) * 24;
    if (this.dayTime >= 24) {
      this.dayTime -= 24;
      this.dayNumber++;
      this.stats.daysSurvived = this.dayNumber;
      this.addNotification(`☀️ Day ${this.dayNumber} has begun! Survivors held through the night.`, 'info');
    }

    // Update Power balance
    let totalPowerConsumption = 0;
    for (const room of this.rooms) {
      totalPowerConsumption += room.powerCost;
    }
    // Turret power draw
    totalPowerConsumption += 4;

    // Generator room check
    const genRoom = this.getRoom('generator');
    const genWorkers = this.survivors.filter(s => s.assignedRoom === 'generator' && !s.isDead).length;
    const hasFuel = this.resources.fuel > 0;
    
    if (hasFuel && genWorkers > 0) {
      const fuelCost = 0.12 * effectiveDt;
      this.resources.fuel = Math.max(0, this.resources.fuel - fuelCost);
      this.resources.power = Math.min(CONFIG.RESOURCE_CAPS.power, this.resources.power + 20 * effectiveDt);
    } else {
      this.resources.power = Math.max(0, this.resources.power - totalPowerConsumption * 0.15 * effectiveDt);
    }

    const isPowered = this.resources.power > 5;

    // Update Rooms production (passes full worker roster for level/XP calculation)
    for (const room of this.rooms) {
      const workers = this.survivors.filter(s => s.assignedRoom === room.id && !s.isDead);
      room.update(effectiveDt, workers, isPowered);
    }

    // Automated Ammo Logistics Dispatch
    this.checkAmmoLogistics();

    // Continuous manual firing if holding mouse
    if (this.manualAim && this.isMouseDown && this.mouseY <= CONFIG.SURFACE_Y + 50) {
      const activeTurret = this.mouseX < 640 ? this.leftTurret : this.rightTurret;
      activeTurret.fireManual(this.mouseX, this.mouseY);
    }

    // Update Survivors
    for (const s of this.survivors) {
      s.update(effectiveDt);
    }

    // Check game over if all survivors dead
    const aliveCount = this.survivors.filter(s => !s.isDead).length;
    if (aliveCount === 0) {
      this.triggerGameOver("All bunker inhabitants have died! The bunker has fallen silent.");
    }

    // Update Elevator
    this.elevator.update(effectiveDt);

    // Update Turrets
    this.leftTurret.update(effectiveDt, this.zombies);
    this.rightTurret.update(effectiveDt, this.zombies);

    // Update Zombies & Wave Manager
    this.waveManager.update(effectiveDt, this.zombies);
    for (let i = this.zombies.length - 1; i >= 0; i--) {
      const z = this.zombies[i];
      z.update(effectiveDt);
      if (z.isDead) {
        this.zombies.splice(i, 1);
      }
    }

    // Update Cabin Searchlights
    this.updateSearchlights(effectiveDt);

    // Update FX
    this.particles.update(effectiveDt, this.dayTime);

    // Occasional chimney smoke puff
    if (Math.random() < 0.14 * effectiveDt * 25) {
      this.particles.spawnSmokePuff(678, CONFIG.SURFACE_Y - 116, 5 + Math.random() * 3);
    }

    // Atmospheric night wind breeze audio
    const isNight = this.dayTime < 6.0 || this.dayTime >= 20.0;
    if (isNight && Math.random() < 0.006 * effectiveDt * 25) {
      if (window.soundSystem && window.soundSystem.playWindBreeze) {
        window.soundSystem.playWindBreeze();
      }
    }

    // Update notifications
    for (let i = this.notifications.length - 1; i >= 0; i--) {
      this.notifications[i].life -= effectiveDt;
      if (this.notifications[i].life <= 0) {
        this.notifications.splice(i, 1);
      }
    }
  }

  draw() {
    const ctx = this.ctx;
    ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);

    // 1. Draw Surface Atmosphere (Sky, Sun/Moon, Stars)
    this.drawSky(ctx);

    // 2. Draw Surface Deep Forest with Parallax Depth (Left and Right)
    this.drawForest(ctx);

    // 3. Draw Ground Soil & Subterranean Strata
    this.drawSubterraneanEarth(ctx);

    // 4. Draw Persistent Blood Decals on Ground
    this.particles.drawDecals(ctx);

    // 5. Draw Surface House Cabin (Pitched roof, window, door, chimney)
    this.drawHouse(ctx);

    // 6. Draw Cabin Roof Searchlights (illuminating forest & tracking zombies)
    this.drawSearchlights(ctx);

    // 7. Draw Ground Fog / Mist Drift across surface
    this.particles.drawFog(ctx, this.dayTime);

    // 8. Draw Elevator Shaft & Lift Car
    this.elevator.draw(ctx);

    // 9. Draw Bunker Rooms Grid
    const isPowered = this.resources.power > 5;
    for (const room of this.rooms) {
      const workers = this.survivors.filter(s => s.assignedRoom === room.id && !s.isDead);
      room.draw(ctx, isPowered, workers);
    }

    // 10. Draw Survivors
    for (const s of this.survivors) {
      s.draw(ctx);
    }

    // 11. Draw Turrets (Left & Right flanking house with laser aim guides)
    this.leftTurret.draw(ctx);
    this.rightTurret.draw(ctx);

    // 12. Draw Zombies
    for (const z of this.zombies) {
      z.draw(ctx);
    }

    // 13. Draw Particle Effects, Tracers, Spits
    this.particles.draw(ctx);

    // 14. Red Emergency Flashing Alarm during Horde
    if (this.waveManager.isHordeActive) {
      const pulse = (Math.sin(Date.now() / 150) + 1) * 0.5;
      ctx.fillStyle = `rgba(231, 76, 60, ${0.14 * pulse})`;
      ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);
    }

    // 15. Draw Tactical Crosshair if manual aim mode is active
    if (this.manualAim) {
      this.drawCrosshair(ctx);
    }

    // 16. Draw On-Screen Notifications
    this.drawNotifications(ctx);
  }

  drawSky(ctx) {
    const hour = this.dayTime;
    let topColor, botColor;

    if (hour >= 6 && hour < 11) {
      // Dawn / Sunrise
      topColor = '#2c3e50';
      botColor = '#e67e22';
    } else if (hour >= 11 && hour < 17) {
      // Midday Sky
      topColor = '#2980b9';
      botColor = '#85c1e9';
    } else if (hour >= 17 && hour < 20) {
      // Sunset
      topColor = '#2c3e50';
      botColor = '#d35400';
    } else {
      // Night Sky
      topColor = '#0b0e14';
      botColor = '#1a252f';
    }

    const grad = ctx.createLinearGradient(0, 0, 0, CONFIG.SURFACE_Y);
    grad.addColorStop(0, topColor);
    grad.addColorStop(1, botColor);
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, this.canvas.width, CONFIG.SURFACE_Y);

    // Stars at night
    if (hour < 6 || hour >= 20) {
      ctx.fillStyle = '#ffffff';
      for (let i = 0; i < 30; i++) {
        const sx = (i * 47) % 1280;
        const sy = (i * 29) % (CONFIG.SURFACE_Y - 40);
        ctx.fillRect(sx, sy, 1.5, 1.5);
      }
    }
  }

  drawForest(ctx) {
    // 1. Distant atmospheric silhouette pines (parallax layer 1)
    this.drawDistantPines(ctx, 0, 420, 22);
    this.drawDistantPines(ctx, 860, 1280, 22);

    // 2. Foreground detailed pines with wind sway (parallax layer 2)
    this.drawTreeGroup(ctx, 0, 390, 16);
    this.drawTreeGroup(ctx, 890, 1280, 16);
  }

  drawDistantPines(ctx, startX, endX, count) {
    const step = (endX - startX) / count;
    const isNight = this.dayTime < 6 || this.dayTime >= 20;
    ctx.fillStyle = isNight ? '#0b161f' : '#1b3834';

    for (let i = 0; i < count; i++) {
      const tx = startX + i * step + Math.sin(i * 4) * 6;
      const height = 75 + (i % 6) * 12;
      const ty = CONFIG.SURFACE_Y - 2;

      ctx.beginPath();
      ctx.moveTo(tx, ty - height);
      ctx.lineTo(tx + 18, ty);
      ctx.lineTo(tx - 18, ty);
      ctx.closePath();
      ctx.fill();
    }
  }

  drawTreeGroup(ctx, startX, endX, count) {
    const step = (endX - startX) / count;
    const windSway = Math.sin(this.gameTime * 1.5) * 2.2;
    for (let i = 0; i < count; i++) {
      const tx = startX + i * step + Math.sin(i * 3) * 8;
      const height = 110 + (i % 5) * 16;
      const ty = CONFIG.SURFACE_Y;

      // Trunk
      ctx.fillStyle = '#2c1e14';
      ctx.fillRect(tx - 3, ty - height * 0.35, 6, height * 0.35);

      // Pine foliage layers with wind sway
      const colors = ['#1a331c', '#224726', '#142916'];
      for (let layer = 0; layer < 3; layer++) {
        const layerY = ty - height * 0.35 - layer * (height * 0.22);
        const w = 38 - layer * 9;
        const sway = windSway * (layer + 1) * 0.6;
        ctx.fillStyle = colors[layer % colors.length];
        ctx.beginPath();
        ctx.moveTo(tx + sway, layerY - 30);
        ctx.lineTo(tx + w, layerY);
        ctx.lineTo(tx - w, layerY);
        ctx.closePath();
        ctx.fill();
      }
    }
  }

  drawSubterraneanEarth(ctx) {
    // Ground line & grass
    ctx.fillStyle = '#27ae60';
    ctx.fillRect(0, CONFIG.SURFACE_Y - 4, this.canvas.width, 6);

    // Deep rocky soil
    ctx.fillStyle = '#2b2118';
    ctx.fillRect(0, CONFIG.SURFACE_Y + 2, this.canvas.width, this.canvas.height - CONFIG.SURFACE_Y);

    // Strata layers & stones
    ctx.fillStyle = '#3a2e22';
    for (let y = CONFIG.SURFACE_Y + 20; y < this.canvas.height; y += 45) {
      ctx.fillRect(0, y, this.canvas.width, 10);
    }

    // Outer bunker heavy reinforced concrete foundation
    ctx.strokeStyle = '#1e272e';
    ctx.lineWidth = 10;
    ctx.strokeRect(
      CONFIG.BUNKER_LEFT - 6,
      CONFIG.BUNKER_TOP - 6,
      (CONFIG.BUNKER_RIGHT - CONFIG.BUNKER_LEFT) + 12,
      CONFIG.FLOORS_COUNT * CONFIG.FLOOR_HEIGHT + 12
    );

    // Hazard yellow/black caution stripes above bunker top
    const hatchX = CONFIG.BUNKER_LEFT;
    const hatchW = CONFIG.BUNKER_RIGHT - CONFIG.BUNKER_LEFT;
    ctx.fillStyle = '#d4ac0d';
    ctx.fillRect(hatchX, CONFIG.BUNKER_TOP - 12, hatchW, 6);
  }

  drawHouse(ctx) {
    const hx = 575;
    const hy = CONFIG.SURFACE_Y - 80;
    const hw = 130;
    const hh = 80;

    // Wooden Cabin Walls
    ctx.fillStyle = '#4a3728';
    ctx.fillRect(hx, hy, hw, hh);

    // Wood plank horizontal lines
    ctx.strokeStyle = '#322316';
    ctx.lineWidth = 1.5;
    for (let p = hy + 12; p < hy + hh; p += 12) {
      ctx.beginPath();
      ctx.moveTo(hx, p);
      ctx.lineTo(hx + hw, p);
      ctx.stroke();
    }

    // Pitched Roof (as drawn in untitled (3).png)
    ctx.fillStyle = '#5c2c16';
    ctx.beginPath();
    ctx.moveTo(hx - 12, hy);
    ctx.lineTo(hx + hw / 2, hy - 45);
    ctx.lineTo(hx + hw + 12, hy);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = '#2d150b';
    ctx.lineWidth = 3;
    ctx.stroke();

    // Chimney with gentle smoke
    ctx.fillStyle = '#7f8c8d';
    ctx.fillRect(hx + hw - 32, hy - 40, 14, 25);
    // Smoke puff
    ctx.fillStyle = 'rgba(200, 200, 200, 0.35)';
    const smokeY = hy - 45 - ((Date.now() / 40) % 30);
    ctx.beginPath();
    ctx.arc(hx + hw - 25, smokeY, 8, 0, Math.PI * 2);
    ctx.fill();

    // Roof Searchlight Mounting Platforms on Pitched Roof
    ctx.fillStyle = '#2d3436';
    ctx.fillRect(hx + 10, hy - 18, 8, 6);
    ctx.fillRect(hx + hw - 18, hy - 18, 8, 6);

    // Illuminated Window with warm radial bloom at night
    if (this.dayTime < 6.5 || this.dayTime >= 18.0) {
      const winGlow = ctx.createRadialGradient(hx + 29, hy + 33, 4, hx + 29, hy + 33, 48);
      winGlow.addColorStop(0, 'rgba(243, 156, 18, 0.52)');
      winGlow.addColorStop(1, 'rgba(243, 156, 18, 0)');
      ctx.fillStyle = winGlow;
      ctx.beginPath();
      ctx.arc(hx + 29, hy + 33, 48, 0, Math.PI * 2);
      ctx.fill();
    }

    ctx.fillStyle = '#f39c12';
    ctx.fillRect(hx + 18, hy + 22, 22, 22);
    ctx.strokeStyle = '#2c1e14';
    ctx.lineWidth = 2;
    ctx.strokeRect(hx + 18, hy + 22, 22, 22);
    ctx.beginPath();
    ctx.moveTo(hx + 29, hy + 22);
    ctx.lineTo(hx + 29, hy + 44);
    ctx.moveTo(hx + 18, hy + 33);
    ctx.lineTo(hx + 40, hy + 33);
    ctx.stroke();

    // Fortified Door / Barricade (entrance to bunker hatch)
    ctx.fillStyle = '#2c3e50';
    ctx.fillRect(hx + 56, hy + 28, 28, 52);
    ctx.strokeStyle = '#7f8c8d';
    ctx.lineWidth = 2;
    ctx.strokeRect(hx + 56, hy + 28, 28, 52);

    // Barricade wooden cross planks
    ctx.strokeStyle = '#e67e22';
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.moveTo(hx + 57, hy + 35);
    ctx.lineTo(hx + 83, hy + 75);
    ctx.moveTo(hx + 83, hy + 35);
    ctx.lineTo(hx + 57, hy + 75);
    ctx.stroke();

    // House Barricade Health Bar
    const hpRatio = Math.max(0, this.houseHp / this.houseMaxHp);
    ctx.fillStyle = '#222';
    ctx.fillRect(hx + 15, hy - 58, 100, 6);
    ctx.fillStyle = hpRatio > 0.5 ? '#2ecc71' : hpRatio > 0.25 ? '#f39c12' : '#e74c3c';
    ctx.fillRect(hx + 15, hy - 58, 100 * hpRatio, 6);
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 8px monospace';
    ctx.textAlign = 'center';
    ctx.fillText(`CABIN: ${Math.round(this.houseHp)}/${this.houseMaxHp} HP`, hx + 65, hy - 63);
  }

  // Update roof searchlights tracking approaching zombies or sweeping dark forest
  updateSearchlights(dt) {
    const isNightOrDusk = this.dayTime < 6.5 || this.dayTime >= 18.0 || this.waveManager.isHordeActive;
    if (!isNightOrDusk) return;

    this.updateSingleSearchlight(this.searchlights.left, 'left', dt);
    this.updateSingleSearchlight(this.searchlights.right, 'right', dt);
  }

  updateSingleSearchlight(light, side, dt) {
    let closestZombie = null;
    let minDist = light.range;

    for (const z of this.zombies) {
      if (z.hp <= 0) continue;
      if (side === 'left' && z.x > 620) continue;
      if (side === 'right' && z.x < 660) continue;

      const dist = Math.hypot(z.x - light.x, z.y - light.y);
      if (dist < minDist) {
        minDist = dist;
        closestZombie = z;
      }
    }

    light.target = closestZombie;

    if (closestZombie) {
      // Actively track target zombie
      const targetY = closestZombie.y - closestZombie.size * 0.6;
      light.targetAngle = Math.atan2(targetY - light.y, closestZombie.x - light.x);
      let diff = light.targetAngle - light.angle;
      while (diff < -Math.PI) diff += Math.PI * 2;
      while (diff > Math.PI) diff -= Math.PI * 2;
      light.angle += diff * Math.min(1, dt * 5.0);
    } else {
      // Idle rhythmic sweep of dark forest
      light.sweepPhase += dt * 0.75;
      if (side === 'left') {
        const centerAngle = Math.PI * 0.85;
        light.angle = centerAngle + Math.sin(light.sweepPhase) * 0.26;
      } else {
        const centerAngle = Math.PI * 0.15;
        light.angle = centerAngle + Math.sin(light.sweepPhase) * 0.26;
      }
    }
  }

  // Render atmospheric cabin searchlights and illuminated ground spotlights
  drawSearchlights(ctx) {
    const isNightOrDusk = this.dayTime < 6.5 || this.dayTime >= 18.0 || this.waveManager.isHordeActive;
    if (!isNightOrDusk) return;

    for (const side of ['left', 'right']) {
      const light = this.searchlights[side];

      ctx.save();
      const beamDist = light.range;
      const spread = 0.26; // half angle in radians

      const p1X = light.x + Math.cos(light.angle - spread) * beamDist;
      const p1Y = light.y + Math.sin(light.angle - spread) * beamDist;
      const p2X = light.x + Math.cos(light.angle + spread) * beamDist;
      const p2Y = light.y + Math.sin(light.angle + spread) * beamDist;
      const centerEndPx = light.x + Math.cos(light.angle) * beamDist;
      const centerEndPy = light.y + Math.sin(light.angle) * beamDist;

      // Volumetric light cone
      const grad = ctx.createRadialGradient(light.x, light.y, 4, centerEndPx, centerEndPy, beamDist);
      grad.addColorStop(0, 'rgba(255, 250, 210, 0.45)');
      grad.addColorStop(0.2, 'rgba(255, 240, 180, 0.24)');
      grad.addColorStop(0.7, 'rgba(240, 230, 170, 0.08)');
      grad.addColorStop(1, 'rgba(220, 210, 150, 0)');

      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.moveTo(light.x, light.y);
      ctx.lineTo(p1X, p1Y);
      ctx.lineTo(p2X, p2Y);
      ctx.closePath();
      ctx.fill();

      // Ground spotlight puddle
      if (Math.sin(light.angle) > 0.08) {
        const groundDist = (CONFIG.SURFACE_Y - light.y) / Math.sin(light.angle);
        if (groundDist > 0 && groundDist < beamDist + 50) {
          const spotX = light.x + Math.cos(light.angle) * groundDist;
          ctx.fillStyle = 'rgba(255, 242, 185, 0.22)';
          ctx.beginPath();
          ctx.ellipse(spotX, CONFIG.SURFACE_Y, 44, 9, 0, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      // Highlight targeted zombie when spotlight tracks them
      if (light.target && light.target.hp > 0) {
        ctx.save();
        ctx.fillStyle = 'rgba(255, 255, 210, 0.25)';
        ctx.shadowColor = '#fff6aa';
        ctx.shadowBlur = 12;
        ctx.beginPath();
        ctx.arc(light.target.x, light.target.y - light.target.size * 0.6, light.target.size * 1.3, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      // Hardware base pedestal and swivel fixture
      ctx.fillStyle = '#2d3436';
      ctx.fillRect(light.x - 3, light.y - 2, 6, 8);

      ctx.save();
      ctx.translate(light.x, light.y);
      ctx.rotate(light.angle);

      // Metal reflector housing
      ctx.fillStyle = '#1e272e';
      ctx.beginPath();
      ctx.arc(0, 0, 7, -Math.PI / 2, Math.PI / 2, true);
      ctx.fill();
      ctx.strokeStyle = '#636e72';
      ctx.lineWidth = 1.5;
      ctx.stroke();

      // Intense bulb & lens glare
      ctx.fillStyle = '#fff9d2';
      ctx.shadowColor = '#ffeaa7';
      ctx.shadowBlur = 14;
      ctx.fillRect(1, -5, 3.5, 10);

      ctx.restore();
      ctx.restore();
    }
  }

  drawNotifications(ctx) {
    let ny = 20;
    for (const notif of this.notifications) {
      const alpha = Math.min(1, notif.life);
      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.font = 'bold 12px "Courier New", monospace';
      const textW = ctx.measureText(notif.text).width;
      
      // Banner box
      ctx.fillStyle = notif.type === 'danger' ? 'rgba(192, 57, 43, 0.9)' :
                      notif.type === 'success' ? 'rgba(39, 174, 96, 0.9)' : 'rgba(41, 128, 185, 0.9)';
      ctx.fillRect(640 - textW / 2 - 12, ny, textW + 24, 22);
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 1;
      ctx.strokeRect(640 - textW / 2 - 12, ny, textW + 24, 22);

      ctx.fillStyle = '#ffffff';
      ctx.textAlign = 'center';
      ctx.fillText(notif.text, 640, ny + 15);
      ctx.restore();

      ny += 28;
    }
  }

  // Autonomous Ammo Logistics Runner Task Trigger
  checkAmmoLogistics() {
    if (this.resources.ammo < 1) return;

    const threshold = CONFIG.AMMO_DELIVERY_THRESHOLD || 0.35;
    const leftLow = this.leftTurret.ammo < (this.leftTurret.stats.maxAmmo * threshold);
    const rightLow = this.rightTurret.ammo < (this.rightTurret.stats.maxAmmo * threshold);

    if (!leftLow && !rightLow) return;

    // Check if a runner is already handling this turret
    const activeTasks = this.survivors.filter(s => s.ammoDeliveryTask);
    const deliveringLeft = activeTasks.some(s => s.ammoDeliveryTask.turret === this.leftTurret);
    const deliveringRight = activeTasks.some(s => s.ammoDeliveryTask.turret === this.rightTurret);

    let needyTurret = null;
    if (leftLow && !deliveringLeft) needyTurret = this.leftTurret;
    else if (rightLow && !deliveringRight) needyTurret = this.rightTurret;

    if (!needyTurret) return;

    // Find best eligible available survivor
    const candidates = this.survivors.filter(s => !s.isDead && !s.ammoDeliveryTask && s.status !== 'resting');
    if (candidates.length === 0) return;

    // Priority: Armory worker, then Airlock, then Workshop, then any worker
    let runner = candidates.find(s => s.assignedRoom === 'armory');
    if (!runner) runner = candidates.find(s => s.assignedRoom === 'airlock');
    if (!runner) runner = candidates.find(s => s.assignedRoom === 'workshop');
    if (!runner) runner = candidates[0];

    if (runner) {
      runner.startAmmoDelivery(needyTurret);
      this.addNotification(`📦 Ammo low! ${runner.name} dispatched with crate for ${needyTurret.side.toUpperCase()} Turret!`, 'info');
    }
  }

  // Toggle Manual Aim Mode
  toggleManualAim() {
    this.manualAim = !this.manualAim;
    if (window.soundSystem) window.soundSystem.playBeep(true);
    this.addNotification(`🎯 Manual Turret Aim: ${this.manualAim ? 'ENGAGED' : 'DISENGAGED'}`, this.manualAim ? 'warning' : 'info');
    if (this.manualAim) {
      this.particles.addFloatingText("MANUAL AIM ENGAGED", 640, 150, '#00f3ff');
    }
    const btn = document.getElementById('btn-manual-aim');
    if (btn) {
      btn.textContent = this.manualAim ? '🎯 Manual Aim: ON' : '🎯 Manual Aim: OFF';
      btn.classList.toggle('active', this.manualAim);
    }
  }

  // Draw Tactical HUD Crosshair
  drawCrosshair(ctx) {
    const mx = this.mouseX;
    const my = this.mouseY;

    ctx.save();
    const pulse = Math.sin(Date.now() / 110) * 2;
    const activeTurret = mx < 640 ? this.leftTurret : this.rightTurret;
    const color = activeTurret.ammo > 0 ? '#00f3ff' : '#ff4757';

    ctx.strokeStyle = color;
    ctx.lineWidth = 1.6;
    ctx.shadowColor = color;
    ctx.shadowBlur = 10;

    // Outer reticle circle
    ctx.beginPath();
    ctx.arc(mx, my, 18 + pulse, 0, Math.PI * 2);
    ctx.stroke();

    // Corner crosshair brackets
    const b = 24;
    ctx.beginPath();
    ctx.moveTo(mx - b, my); ctx.lineTo(mx - b + 7, my);
    ctx.moveTo(mx + b, my); ctx.lineTo(mx + b - 7, my);
    ctx.moveTo(mx, my - b); ctx.lineTo(mx, my - b + 7);
    ctx.moveTo(mx, my + b); ctx.lineTo(mx, my + b - 7);
    ctx.stroke();

    // Center dot
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.arc(mx, my, 2.5, 0, Math.PI * 2);
    ctx.fill();

    // HUD Text near reticle
    ctx.font = 'bold 9px monospace';
    ctx.fillStyle = color;
    ctx.fillText(`${activeTurret.side.toUpperCase()}: ${activeTurret.ammo}/${activeTurret.stats.maxAmmo}`, mx + 22, my - 6);
    ctx.fillText(activeTurret.ammo > 0 ? '[L-CLICK FIRE]' : '[OUT OF AMMO]', mx + 22, my + 8);

    ctx.restore();
  }

  gameLoop(now) {
    if (!this.running) return;
    const dt = Math.min(0.1, (now - this.lastTimestamp) / 1000);
    this.lastTimestamp = now;

    this.update(dt);
    this.draw();

    if (window.uiManager) {
      window.uiManager.updateHUD();
    }

    requestAnimationFrame((t) => this.gameLoop(t));
  }

  start() {
    this.lastTimestamp = performance.now();
    requestAnimationFrame((t) => this.gameLoop(t));
  }
}

window.GameEngine = GameEngine;


// --- ui.js ---
// UI Manager & Modal Controllers
class UIManager {
  constructor() {
    this.modalOverlay = document.getElementById('modal-overlay');
    this.modalContent = document.getElementById('modal-content');
    this.activeModal = null;
  }

  updateHUD() {
    const engine = window.gameEngine;
    if (!engine) return;

    // Day & Time
    const hours = Math.floor(engine.dayTime);
    const mins = Math.floor((engine.dayTime % 1) * 60);
    const timeStr = `${String(hours).padStart(2, '0')}:${String(mins).padStart(2, '0')}`;
    const dayEl = document.getElementById('hud-day');
    if (dayEl) dayEl.textContent = `Day ${engine.dayNumber} - ${timeStr}`;

    // Resources
    const res = engine.resources;
    this.setVal('res-ammo', Math.floor(res.ammo), CONFIG.RESOURCE_CAPS.ammo);
    this.setVal('res-power', Math.floor(res.power), CONFIG.RESOURCE_CAPS.power);
    this.setVal('res-food', Math.floor(res.food), CONFIG.RESOURCE_CAPS.food);
    this.setVal('res-water', Math.floor(res.water), CONFIG.RESOURCE_CAPS.water);
    this.setVal('res-metal', Math.floor(res.metal), CONFIG.RESOURCE_CAPS.metal);
    this.setVal('res-gunpowder', Math.floor(res.gunpowder), CONFIG.RESOURCE_CAPS.gunpowder);
    this.setVal('res-fuel', Math.floor(res.fuel), CONFIG.RESOURCE_CAPS.fuel);

    // Population
    const aliveCount = engine.survivors.filter(s => !s.isDead).length;
    const popEl = document.getElementById('hud-pop');
    if (popEl) popEl.textContent = `${aliveCount} Alive`;

    // Threat Radar
    const radarEl = document.getElementById('hud-radar');
    if (radarEl) {
      if (engine.waveManager.isHordeActive) {
        radarEl.className = 'radar-badge danger pulse';
        radarEl.innerHTML = `⚠️ HORDE ATTACKING! (Wave ${engine.waveManager.currentWave})`;
      } else {
        const secs = Math.ceil(engine.waveManager.timer);
        radarEl.className = secs <= 15 ? 'radar-badge warning pulse' : 'radar-badge normal';
        radarEl.innerHTML = `📡 Swarm in: ${secs}s (Wave ${engine.waveManager.currentWave + 1})`;
      }
    }

    // Turret quick HUD bars
    this.updateTurretWidget('left-turret-hud', engine.leftTurret);
    this.updateTurretWidget('right-turret-hud', engine.rightTurret);
  }

  setVal(id, current, max) {
    const el = document.getElementById(id);
    if (el) {
      el.textContent = `${current}/${max}`;
      // Highlight low ammo
      if (id === 'res-ammo') {
        el.style.color = current < 50 ? '#ff4d4d' : current < 150 ? '#ffaa00' : '#ffeaa7';
      }
    }
  }

  updateTurretWidget(containerId, turret) {
    const el = document.getElementById(containerId);
    if (!el) return;
    const engine = window.gameEngine;
    if (!engine) return;

    const ammoRatio = turret.ammo / turret.stats.maxAmmo;
    const hpRatio = turret.health / turret.maxHealth;

    const ammoStatusClass = turret.ammo === 0 ? 'critical pulse' : ammoRatio < 0.25 ? 'warning pulse' : '';
    const alertBadge = turret.ammo === 0
      ? '<span class="hud-alert-badge danger">DEPLETED!</span>'
      : ammoRatio < 0.25
        ? '<span class="hud-alert-badge warn">LOW AMMO</span>'
        : '';

    const isCarrierEnRoute = engine.survivors.some(s => s.ammoDeliveryTask && s.ammoDeliveryTask.turret === turret);
    const carrierBadge = isCarrierEnRoute ? '<span class="badge-carrier">📦 RUNNER EN ROUTE</span>' : '';

    el.innerHTML = `
      <div class="turret-hud-header">
        <div class="turret-hud-title">🛡️ ${turret.side.toUpperCase()} SENTRY [T${turret.tierIndex + 1}]</div>
        ${carrierBadge || alertBadge}
      </div>
      <div class="hud-bar-row ${ammoStatusClass}">
        <span class="hud-label">📦 AMMO:</span>
        <div class="progress-bar">
          <div class="progress-fill ${ammoRatio < 0.15 ? 'bar-red' : ammoRatio < 0.4 ? 'bar-amber' : 'bar-green'}" style="width: ${ammoRatio * 100}%"></div>
        </div>
        <span class="val-text">${turret.ammo}/${turret.stats.maxAmmo}</span>
      </div>
      <div class="hud-bar-row">
        <span class="hud-label">❤️ HULL:</span>

          <div class="progress-fill ${hpRatio < 0.3 ? 'bar-red' : 'bar-blue'}" style="width: ${hpRatio * 100}%"></div>
        </div>
        <span class="val-text">${Math.round(turret.health)}/${turret.maxHealth}</span>
      </div>
      <div class="turret-btn-row">
        <button class="btn btn-sm btn-action" onclick="window.gameEngine.${turret.side}Turret.reload()">RELOAD (50)</button>
        <button class="btn btn-sm btn-secondary" onclick="window.gameEngine.${turret.side}Turret.repair()">REPAIR (10M)</button>
        <button class="btn btn-sm" title="Target Priority: ${turret.priorityMode}" onclick="window.gameEngine.${turret.side}Turret.cyclePriority(); window.uiManager.updateHUD();">🎯 ${turret.priorityMode.toUpperCase().slice(0, 4)}</button>
        <button class="btn btn-sm btn-accent" onclick="window.uiManager.openTurretModal(window.gameEngine.${turret.side}Turret)">SPECS</button>
      </div>
    `;
  }

  openRoomModal(room) {
    const engine = window.gameEngine;
    const workers = engine.survivors.filter(s => s.assignedRoom === room.id && !s.isDead);
    const unassigned = engine.survivors.filter(s => s.assignedRoom !== room.id && !s.isDead);

    const upgradeCost = room.level * 40;
    const canUpgrade = engine.resources.metal >= upgradeCost;

    let prodHtml = '';
    if (room.produces) {
      prodHtml = `
        <div class="modal-info-box">
          <strong>Production Yield:</strong> ${room.produces.toUpperCase()} (+${room.baseRate * room.level}/s with workers)
          ${room.cost ? `<br><span class="text-dim">Consumes: ${Object.entries(room.cost).map(([k, v]) => `${k}: ${v}/s`).join(', ')}</span>` : ''}
        </div>
      `;
    }

    let workersListHtml = workers.map(w => `
      <div class="worker-card">
        <div>${w.avatar} <strong>${w.name}</strong> (${w.role}) - HP: ${Math.round(w.hp)}%</div>
        <button class="btn btn-sm btn-danger" onclick="window.uiManager.reassignWorker('${w.id}', 'quarters_1')">Unassign</button>
      </div>
    `).join('');

    if (workers.length === 0) {
      workersListHtml = `<p class="text-dim">No survivors currently working in this room. Room is idle!</p>`;
    }

    let assignOptionsHtml = unassigned.map(u => `
      <option value="${u.id}">${u.avatar} ${u.name} (${u.role})</option>
    `).join('');

    this.showModal(`
      <div class="modal-header">
        <h2>${room.icon} ${room.name} (Tier ${room.level})</h2>
        <button class="modal-close" onclick="window.uiManager.closeModal()">&times;</button>
      </div>
      <p class="modal-desc">${room.desc}</p>
      ${prodHtml}
      <div class="modal-section">
        <h3>Assigned Crew (${workers.length}/${room.maxWorkers})</h3>
        <div class="workers-container">${workersListHtml}</div>
        ${workers.length < room.maxWorkers && unassigned.length > 0 ? `
          <div class="assign-row">
            <select id="assign-select" class="form-select">${assignOptionsHtml}</select>
            <button class="btn btn-primary" onclick="window.uiManager.assignSelectedWorker('${room.id}')">Assign Worker</button>
          </div>
        ` : ''}
      </div>
      <div class="modal-footer">
        <button class="btn btn-accent" ${!canUpgrade ? 'disabled' : ''} onclick="window.uiManager.upgradeRoom('${room.id}')">
          Upgrade Room (Cost: ${upgradeCost} Metal)
        </button>
        <button class="btn btn-secondary" onclick="window.uiManager.closeModal()">Close</button>
      </div>
    `);
  }

  assignSelectedWorker(roomId) {
    const sel = document.getElementById('assign-select');
    if (!sel) return;
    const survivorId = sel.value;
    const survivor = window.gameEngine.survivors.find(s => s.id === survivorId);
    if (survivor) {
      survivor.assignTo(roomId);
      window.soundSystem.playBeep(true);
      const room = window.gameEngine.getRoom(roomId);
      this.openRoomModal(room);
    }
  }

  reassignWorker(survivorId, targetRoomId) {
    const survivor = window.gameEngine.survivors.find(s => s.id === survivorId);
    if (survivor) {
      const prevRoom = survivor.assignedRoom;
      survivor.assignTo(targetRoomId);
      window.soundSystem.playBeep(true);
      const room = window.gameEngine.getRoom(prevRoom);
      if (room) this.openRoomModal(room);
    }
  }

  upgradeRoom(roomId) {
    const room = window.gameEngine.getRoom(roomId);
    if (room && room.upgrade()) {
      this.openRoomModal(room);
    }
  }

            <button class="priority-btn ${turret.priorityMode === 'lowest_hp' ? 'active' : ''}" onclick="window.gameEngine.${turret.side}Turret.setPriority('lowest_hp'); window.uiManager.openTurretModal(window.gameEngine.${turret.side}Turret)">Lowest HP</button>
            <button class="priority-btn ${turret.priorityMode === 'strongest' ? 'active' : ''}" onclick="window.gameEngine.${turret.side}Turret.setPriority('strongest'); window.uiManager.openTurretModal(window.gameEngine.${turret.side}Turret)">Strongest</button>
            <button class="priority-btn ${turret.priorityMode === 'boss' ? 'active' : ''}" onclick="window.gameEngine.${turret.side}Turret.setPriority('boss'); window.uiManager.openTurretModal(window.gameEngine.${turret.side}Turret)">Boss/Brute</button>

          🎯 Manual Mouse Aim Mode: ${window.gameEngine.manualAim ? 'ENGAGED (Click to Aim & Fire)' : 'DISABLED (Autonomous AI)'}
        </button>

          Reload Ammo from Bunker Stock (50 rounds)
