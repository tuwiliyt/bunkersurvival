  update(dt, dayTime = 12) {
    // Safety cap on active particles to guarantee strictly bounded memory
    if (this.particles.length > 400) {
      this.particles.splice(0, this.particles.length - 400);
    }
    if (this.tracers.length > 50) {
      this.tracers.splice(0, this.tracers.length - 50);
    }
    if (this.floatingTexts.length > 40) {
      this.floatingTexts.splice(0, this.floatingTexts.length - 40);
    }
    if (this.chimneySmoke.length > 40) {
      this.chimneySmoke.splice(0, this.chimneySmoke.length - 40);
    }
    if (this.acidPuddles.length > 25) {
      this.acidPuddles.splice(0, this.acidPuddles.length - 25);
    }

    // Update generic particles & spent brass physics
    for (let i = this.particles.length - 1; i >= 0; i--) {
      const p = this.particles[i];
      p.life -= dt;
      if (p.life <= 0) {
        this.particles.splice(i, 1);
        continue;
      }

      if (p.type === 'brass_casing') {
        // Tumbling Brass Physics
        if (!p.settled) {
          p.vy += p.gravity * dt;
          p.x += p.vx * dt * 40;
          p.y += p.vy * dt * 40;
          p.angle += p.vRot * dt;

          // Ground or watchtower deck bounce collision
          const floorY = p.floorY !== undefined ? p.floorY : (CONFIG.SURFACE_Y - 2);
          if (p.y >= floorY) {
            p.y = floorY;
            if (p.bounces < p.maxBounces && Math.abs(p.vy) > 0.8) {
              p.vy = -Math.abs(p.vy) * (0.38 + Math.random() * 0.16);
              p.vx *= 0.62;
              p.vRot = (Math.random() - 0.5) * 16;
              p.bounces++;
            } else {
              // Settled flat on ground
              p.settled = true;
              p.vx = 0;
              p.vy = 0;
              p.vRot = 0;
              p.angle = (Math.random() - 0.5) * 0.35;
            }
          }
        }
        continue;
      }

      if (p.type === 'spark_streak') {
        p.prevX = p.x;
        p.prevY = p.y;
        p.x += p.vx * dt * 40;
        p.y += p.vy * dt * 40;
        p.vy += p.gravity * dt;
        p.vx *= Math.pow(0.93, dt * 40); // Air resistance drag
        continue;
      }

      if (p.type === 'blood_drop') {
        p.prevX = p.x;
        p.prevY = p.y;
        p.x += p.vx * dt * 40;
        p.y += p.vy * dt * 40;
        p.vy += p.gravity * dt;
        continue;
      }

      if (p.type === 'toxic_steam') {
        p.phase += dt * 3.2;
        p.x += (p.vx + Math.sin(p.phase) * 10) * dt;
        p.y += p.vy * dt;
        p.radius += dt * 7.5;
        continue;
      }

      if (p.type === 'coolant_puff' || p.type === 'smoke_puff') {
        p.x += p.vx * dt * 40;
        p.y += p.vy * dt * 40;
        p.radius += dt * 8.0;
        continue;
      }

      if (p.type === 'plasma_ring') {
        p.radius += (p.maxRadius - p.radius) * Math.min(1, dt * 18);
        continue;
      }

      // Standard particle motion
      p.x += (p.vx || 0) * dt * 40;
      p.y += (p.vy || 0) * dt * 40;
      if (p.gravity) {
        p.vy += p.gravity * dt;
      }
    }

    // Update tracers
    for (let i = this.tracers.length - 1; i >= 0; i--) {
      const t = this.tracers[i];
      t.life -= dt;
      if (t.life <= 0) {
        this.tracers.splice(i, 1);
      }
    }

    // Update floating texts
    for (let i = this.floatingTexts.length - 1; i >= 0; i--) {
      const ft = this.floatingTexts[i];
      ft.life -= dt;
      ft.y += ft.vy * dt;
      if (ft.life <= 0) {
        this.floatingTexts.splice(i, 1);
      }
    }

    // Update leaves
    for (const leaf of this.leaves) {
      leaf.x += leaf.speedX;
      leaf.y += leaf.speedY;
      if (leaf.x < 0) leaf.x = 1280;
      if (leaf.y > CONFIG.SURFACE_Y) {
        leaf.y = 0;
        leaf.x = Math.random() * 1280;
      }
    }

    // Update falling pine needles with aerodynamic tumbling & wind sway
    for (const needle of this.pineNeedles) {
      needle.swayPhase += dt * 3.4;
      needle.x += (needle.speedX + Math.sin(needle.swayPhase) * needle.swayAmp) * dt;
      needle.y += needle.speedY * dt;
      needle.angle += needle.rotSpeed * dt;
      if (needle.y > CONFIG.SURFACE_Y - 2 || needle.x < -30 || needle.x > 1310) {
        needle.y = 10 + Math.random() * 80;
        const isLeft = Math.random() < 0.5;
        needle.x = isLeft ? Math.random() * 420 : 860 + Math.random() * 420;
      }
    }

    // Update ambient atmospheric forest spores / floating pollen
    for (const sp of this.ambientSpores) {
      sp.phase += dt * 1.6;
      sp.x += sp.vx * dt;
      sp.y += (sp.vy + Math.sin(sp.phase) * 5) * dt;
      if (sp.x < -10) {
        sp.x = 1290;
        sp.y = 30 + Math.random() * (CONFIG.SURFACE_Y - 40);
      }
    }

    // Update ground fog wisps
    for (const f of this.fogPuffs) {
      f.x += f.speedX * dt;
      f.phase += dt * 0.8;
      if (f.x < -100) {
        f.x = 1380;
        f.y = f.tier === 0 ? CONFIG.SURFACE_Y - 14 + Math.random() * 16 : CONFIG.SURFACE_Y - 38 + Math.random() * 26;
      }
    }

    // Update chimney smoke with thermal deceleration, buoyancy, and vortex curls
    for (let i = this.chimneySmoke.length - 1; i >= 0; i--) {
      const s = this.chimneySmoke[i];
      s.life -= dt;
      if (s.life <= 0) {
        this.chimneySmoke.splice(i, 1);
        continue;
      }
      s.curlPhase += (s.curlSpeed || 2.0) * dt;
      s.vy = (s.vy || -20) * Math.pow(0.92, dt * 25);
      s.x += ((s.vx || -10) + Math.sin(s.curlPhase) * (s.curlAmp || 5)) * dt;
      s.y += (s.vy - 6) * dt;
      const progress = 1 - (s.life / s.maxLife);
      s.radius = (s.initialRadius || 5) + ((s.maxRadius || 24) - (s.initialRadius || 5)) * Math.sin(progress * Math.PI * 0.5);
    }

    // Update chimney embers (glowing hearth fire sparks)
    if (this.chimneyEmbers) {
      for (let i = this.chimneyEmbers.length - 1; i >= 0; i--) {
        const e = this.chimneyEmbers[i];
        e.life -= dt;
        if (e.life <= 0) {
          this.chimneyEmbers.splice(i, 1);
          continue;
        }
        e.wobble += dt * 5.5;
        e.x += (e.vx + Math.sin(e.wobble) * 8) * dt;
        e.y += e.vy * dt;
        e.vy += 14 * dt; // gravity slows rising sparks
      }
    }

    // Update blood decals (slow fade over time)
    for (let i = this.bloodDecals.length - 1; i >= 0; i--) {
      const d = this.bloodDecals[i];
      d.life -= dt;
      if (d.life <= 0) {
        this.bloodDecals.splice(i, 1);
      }
    }

    // Update acid spit projectiles
    for (let i = this.spitProjectiles.length - 1; i >= 0; i--) {
      const s = this.spitProjectiles[i];
      s.life -= dt;
      s.x += s.vx * dt;
      s.y += s.vy * dt;

      // Check impact with ground or house
      if (s.y >= CONFIG.SURFACE_Y - 10 || Math.abs(s.x - 640) < 60 || s.life <= 0) {
        this.spawnBlood(s.x, s.y, 10, '#55ff22');
        this.spawnBloodDecal(s.x, CONFIG.SURFACE_Y, '#2f7516', 8, 5);
        this.spawnAcidPuddle(s.x, CONFIG.SURFACE_Y, s.damage);
        if (window.gameEngine) {
          window.gameEngine.damageHouse(s.damage);
        }
        this.spitProjectiles.splice(i, 1);
      }
    }

    // Update boiling acid puddles (toxic ground hazards)
    for (let i = this.acidPuddles.length - 1; i >= 0; i--) {
      const p = this.acidPuddles[i];
      p.life -= dt;
      if (p.life <= 0) {
        this.acidPuddles.splice(i, 1);
        continue;
      }

      // Sizzle toxic vapor steam rising from boiling puddle
      p.sizzleTimer -= dt;
      if (p.sizzleTimer <= 0) {
        p.sizzleTimer = 0.12;
        const ox = (Math.random() - 0.5) * p.radius * 1.6;
        this.particles.push({
          x: p.x + ox,
          y: p.y - 3,
          vx: (Math.random() - 0.5) * 4,
          vy: -14 - Math.random() * 12,
          radius: 3.5,
          phase: Math.random() * Math.PI * 2,
          life: 0.65 + Math.random() * 0.35,
          maxLife: 1.0,
          color: 'rgba(123, 237, 159, 0.45)',
          type: 'toxic_steam'
        });
      }

      // Area of effect damage over time
      const engine = window.gameEngine;
      if (engine) {
        // Damage house barricade if puddle overlaps cabin (cabin x: 575 to 705)
        if (p.x >= 550 && p.x <= 730) {
          engine.damageHouse(CONFIG.ACID_PUDDLE_DPS * dt);
        }
        // Damage turrets if puddle near turret
        if (Math.abs(p.x - engine.leftTurret.x) < p.radius + 15) {
          engine.leftTurret.health = Math.max(0, engine.leftTurret.health - CONFIG.ACID_PUDDLE_DPS * dt * 0.5);
        }
        if (Math.abs(p.x - engine.rightTurret.x) < p.radius + 15) {
          engine.rightTurret.health = Math.max(0, engine.rightTurret.health - CONFIG.ACID_PUDDLE_DPS * dt * 0.5);
        }
        // Damage survivors walking across surface
        for (const s of engine.survivors) {
          if (!s.isDead && s.y <= CONFIG.SURFACE_Y + 5 && Math.abs(s.x - p.x) < p.radius + 10) {
            s.hp = Math.max(0, s.hp - CONFIG.ACID_PUDDLE_DPS * dt);
            if (Math.random() < 0.04 && !s.speechText) {
              s.say("Toxic acid burn!", 2);
            }
          }
        }
      }
    }
  }

  // Draw persistent ground blood decals
  drawDecals(ctx) {
    for (const d of this.bloodDecals) {
      const alpha = Math.min(0.85, (d.life / d.maxLife) * 1.2);
      ctx.save();
      ctx.globalAlpha = alpha;

      // Base pool
      ctx.fillStyle = d.color;
      ctx.beginPath();
      ctx.ellipse(d.x, d.y, d.baseRadius * 1.3, d.baseRadius * 0.45, 0, 0, Math.PI * 2);
      ctx.fill();

      // Core dried dark spot
      ctx.fillStyle = d.coreColor || '#360505';
      ctx.beginPath();
      ctx.ellipse(d.x + 1, d.y, d.baseRadius * 0.7, d.baseRadius * 0.28, 0, 0, Math.PI * 2);
      ctx.fill();

      // Droplet splatters radiating outwards
      ctx.fillStyle = d.color;
      for (const sp of d.splats) {
        ctx.beginPath();
        ctx.arc(d.x + sp.dx, d.y + sp.dy, sp.r, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();
    }
  }

  // Draw atmospheric ground fog and rolling mist across forest floor
  drawFog(ctx, dayTime = 12) {
    const isNight = dayTime < 5.0 || dayTime >= 21.0;
    const isDawn = dayTime >= 5.0 && dayTime < 8.5;
    const isDusk = dayTime >= 16.5 && dayTime < 19.5;
    const isTwilight = dayTime >= 19.5 && dayTime < 21.0;
    const isHorde = window.gameEngine && window.gameEngine.waveManager && window.gameEngine.waveManager.isHordeActive;

    let timeMultiplier = 0.45;
    let fogColorInner, fogColorOuter;

    if (isHorde) {
      timeMultiplier = 1.35;
      fogColorInner = 'rgba(85, 30, 30, ';
      fogColorOuter = 'rgba(45, 15, 15, 0)';
    } else if (isNight) {
      timeMultiplier = 1.25;
      fogColorInner = 'rgba(32, 46, 60, ';
      fogColorOuter = 'rgba(16, 24, 34, 0)';
    } else if (isTwilight) {
      timeMultiplier = 0.95;
      fogColorInner = 'rgba(65, 52, 75, ';
      fogColorOuter = 'rgba(38, 30, 45, 0)';
    } else if (isDusk) {
      timeMultiplier = 0.85;
      fogColorInner = 'rgba(125, 88, 85, ';
      fogColorOuter = 'rgba(70, 48, 50, 0)';
    } else if (isDawn) {
      timeMultiplier = 0.90;
      fogColorInner = 'rgba(170, 130, 105, ';
      fogColorOuter = 'rgba(95, 70, 55, 0)';
    } else {
      timeMultiplier = 0.45;
      fogColorInner = 'rgba(215, 230, 240, ';
      fogColorOuter = 'rgba(180, 200, 210, 0)';
    }

    ctx.save();
    for (const f of this.fogPuffs) {
      const wave = Math.sin(f.phase) * 0.28 + 0.72;
      const alpha = f.baseAlpha * timeMultiplier * wave;
      if (alpha <= 0.01) continue;

      const grad = ctx.createRadialGradient(f.x, f.y, f.radiusY * 0.25, f.x, f.y, f.radiusX);
      grad.addColorStop(0, fogColorInner + alpha.toFixed(3) + ')');
      grad.addColorStop(0.65, fogColorInner + (alpha * 0.45).toFixed(3) + ')');
      grad.addColorStop(1, fogColorOuter);

      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.ellipse(f.x, f.y, f.radiusX, f.radiusY, 0, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
  }

  draw(ctx) {
    // 1. Draw volumetric chimney smoke with soft radial diffusion
    for (const s of this.chimneySmoke) {
      const alpha = Math.max(0, (s.life / s.maxLife) * 0.42);
      if (alpha <= 0.01) continue;
      ctx.save();
      const grad = ctx.createRadialGradient(s.x, s.y, s.radius * 0.15, s.x, s.y, s.radius);
      const toneBase = s.tone || 'rgba(218, 222, 230, ';
      grad.addColorStop(0, toneBase + alpha.toFixed(3) + ')');
      grad.addColorStop(0.55, toneBase + (alpha * 0.52).toFixed(3) + ')');
      grad.addColorStop(1, toneBase + '0)');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.radius, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    // 2. Draw glowing chimney embers drifting from hearth fire
    for (const e of this.chimneyEmbers) {
      const alpha = Math.max(0, e.life / e.maxLife);
      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.fillStyle = e.color;
      ctx.shadowColor = e.color;
      ctx.shadowBlur = 6;
      ctx.beginPath();
      ctx.arc(e.x, e.y, e.size, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    // 3. Draw falling pine needles drifting through the canopy
    for (const needle of this.pineNeedles) {
      ctx.save();
      ctx.translate(needle.x, needle.y);
      ctx.rotate(needle.angle);
      ctx.strokeStyle = needle.color;
      ctx.lineWidth = needle.width;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(-needle.length * 0.5, 0);
      ctx.lineTo(needle.length * 0.5, 0);
      ctx.stroke();
      ctx.restore();
    }

    // 4. Draw ambient forest spores and pollen motes
    for (const sp of this.ambientSpores) {
      const alpha = sp.alpha * (0.6 + Math.sin(sp.phase) * 0.4);
      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.fillStyle = '#fffae6';
      ctx.shadowColor = '#fff3b0';
      ctx.shadowBlur = 4;
      ctx.beginPath();
      ctx.arc(sp.x, sp.y, sp.size, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    // 5. Draw leaves
    for (const leaf of this.leaves) {
      ctx.fillStyle = leaf.color;
      ctx.beginPath();
      ctx.arc(leaf.x, leaf.y, leaf.size, 0, Math.PI * 2);
      ctx.fill();
    }

    // Draw bullet tracers & plasma ion beams
    for (const t of this.tracers) {
      const alpha = Math.max(0, t.life / t.maxLife);
      ctx.save();
      ctx.globalAlpha = alpha;

      if (t.isPlasma) {
        // High-energy Plasma Ion Beam: Wide cyan aura + bright white core + crackling filament
        ctx.strokeStyle = 'rgba(0, 243, 255, 0.4)';
        ctx.lineWidth = 8;
        ctx.beginPath();
        ctx.moveTo(t.x1, t.y1);
        ctx.lineTo(t.x2, t.y2);
        ctx.stroke();

        ctx.strokeStyle = '#00f3ff';
        ctx.lineWidth = 3.5;
        ctx.stroke();

        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 1.4;
        ctx.stroke();

        // Electric micro-filament deviation
        const midX = (t.x1 + t.x2) * 0.5 + (Math.random() - 0.5) * 8;
        const midY = (t.y1 + t.y2) * 0.5 + (Math.random() - 0.5) * 8;
        ctx.strokeStyle = '#e0ffff';
        ctx.lineWidth = 1.0;
        ctx.beginPath();
        ctx.moveTo(t.x1, t.y1);
        ctx.lineTo(midX, midY);
        ctx.lineTo(t.x2, t.y2);
        ctx.stroke();
      } else {
        // Ballistic bullet tracer
        ctx.strokeStyle = t.color;
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        ctx.moveTo(t.x1, t.y1);
        ctx.lineTo(t.x2, t.y2);
        ctx.stroke();

        // White-hot core
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 1.0;
        ctx.stroke();
      }
      ctx.restore();
    }

    // Draw boiling ground acid puddles with animated caustic bubbles
    for (const p of this.acidPuddles) {
      const alpha = Math.min(0.88, (p.life / p.maxLife) * 1.3);
      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.shadowColor = '#2ed573';
      ctx.shadowBlur = 14;

      // Outer scorched earth caustic border
      ctx.fillStyle = '#173d15';
      ctx.beginPath();
      ctx.ellipse(p.x, p.y, p.radius * 1.3, p.radius * 0.38, 0, 0, Math.PI * 2);
      ctx.fill();

      // Glowing bubbling green chemical pool
      ctx.fillStyle = '#2ed573';
      ctx.beginPath();
      ctx.ellipse(p.x, p.y, p.radius * 0.98, p.radius * 0.24, 0, 0, Math.PI * 2);
      ctx.fill();

      // Inner chartreuse core
      ctx.fillStyle = '#7bed9f';
      ctx.beginPath();
      ctx.ellipse(p.x, p.y, p.radius * 0.65, p.radius * 0.15, 0, 0, Math.PI * 2);
      ctx.fill();

      // Boiling popping bubbles
      ctx.fillStyle = '#e8ffea';
      for (const b of p.bubbles) {
        b.phase += 0.06;
        const bScale = (Math.sin(b.phase) + 1) * 0.5;
        if (bScale > 0.05) {
          ctx.beginPath();
          ctx.arc(p.x + b.ox, p.y + b.oy, b.r * bScale, 0, Math.PI * 2);
          ctx.fill();
        }
      }
      ctx.restore();
    }

    // Draw acid spit projectiles
    for (const s of this.spitProjectiles) {
      ctx.save();
      ctx.fillStyle = '#66ff22';
      ctx.shadowColor = '#66ff22';
      ctx.shadowBlur = 10;
      ctx.beginPath();
      ctx.arc(s.x, s.y, 5, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    // Draw all particle types
    for (const p of this.particles) {
      const alpha = Math.max(0, p.life / p.maxLife);
      ctx.save();
      ctx.globalAlpha = alpha;

      if (p.type === 'brass_casing') {
        // Tumbling Brass Shell Casing with metallic highlight and rim
        ctx.translate(p.x, p.y);
        ctx.rotate(p.angle);
        ctx.fillStyle = p.color;
        ctx.fillRect(-p.width * 0.5, -p.height * 0.5, p.width, p.height);

        // Dark rim extractor groove
        ctx.fillStyle = '#7a5a10';
        ctx.fillRect(-p.width * 0.5, -p.height * 0.5, p.width * 0.2, p.height);

        // Specular brass shine
        ctx.fillStyle = '#fff4a3';
        ctx.fillRect(-p.width * 0.3, -p.height * 0.4, p.width * 0.6, p.height * 0.3);
      } else if (p.type === 'starburst_flash') {
        // Multi-point starburst muzzle flash
        ctx.translate(p.x, p.y);
        ctx.rotate(p.angle);

        // Outer glow flare
        ctx.fillStyle = p.flareColor;
        ctx.shadowColor = p.flareColor;
        ctx.shadowBlur = 18;
        ctx.beginPath();
        ctx.arc(0, 0, p.size * 0.6, 0, Math.PI * 2);
        ctx.fill();

        // Radiating starburst spikes
        ctx.strokeStyle = p.flareColor;
        ctx.lineWidth = 2.2;
        const spikes = p.spikeCount || 5;
        const len = p.spikeLen || 24;
        ctx.beginPath();
        for (let s = 0; s < spikes; s++) {
          const sAngle = (s / spikes) * Math.PI * 1.5 - Math.PI * 0.75;
          const sLen = s === 0 ? len : len * (0.5 + Math.random() * 0.4);
          ctx.moveTo(0, 0);
          ctx.lineTo(Math.cos(sAngle) * sLen, Math.sin(sAngle) * sLen);
        }
        ctx.stroke();

        // White-hot inner core
        ctx.fillStyle = p.coreColor || '#ffffff';
        ctx.beginPath();
        ctx.arc(0, 0, p.size * 0.35, 0, Math.PI * 2);
        ctx.fill();
      } else if (p.type === 'plasma_flash') {
        // Cyan plasma muzzle flare
        ctx.fillStyle = '#00f3ff';
        ctx.shadowColor = '#00f3ff';
        ctx.shadowBlur = 24;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size * 0.75, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size * 0.4, 0, Math.PI * 2);
        ctx.fill();
      } else if (p.type === 'plasma_ring') {
        // Expanding plasma shockwave ring
        ctx.strokeStyle = p.color;
        ctx.lineWidth = 2.0;
        ctx.shadowColor = p.color;
        ctx.shadowBlur = 10;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        ctx.stroke();
      } else if (p.type === 'electric_arc') {
        // Crackling electric arc filament
        ctx.strokeStyle = p.color;
        ctx.lineWidth = 1.4;
        ctx.shadowColor = p.color;
        ctx.shadowBlur = 8;
        const midX = (p.x + p.tx) * 0.5 + (Math.random() - 0.5) * 6;
        const midY = (p.y + p.ty) * 0.5 + (Math.random() - 0.5) * 6;
        ctx.beginPath();
        ctx.moveTo(p.x, p.y);
        ctx.lineTo(midX, midY);
        ctx.lineTo(p.tx, p.ty);
        ctx.stroke();
      } else if (p.type === 'flash_vent') {
        // Lateral muzzle brake gas vent jet
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size * alpha, 0, Math.PI * 2);
        ctx.fill();
      } else if (p.type === 'spark_streak') {
        // Incandescent motion streak spark
        ctx.strokeStyle = p.color;
        ctx.lineWidth = p.size;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(p.prevX, p.prevY);
        ctx.lineTo(p.x, p.y);
        ctx.stroke();

        // White-hot head
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size * 0.6, 0, Math.PI * 2);
        ctx.fill();
      } else if (p.type === 'blood_drop') {
        // Arterial blood droplet streak
        ctx.strokeStyle = p.color;
        ctx.lineWidth = p.size;
        ctx.beginPath();
        ctx.moveTo(p.prevX, p.prevY);
        ctx.lineTo(p.x, p.y);
        ctx.stroke();
      } else if (p.type === 'flesh_chunk') {
        // Tumbling flesh/gib chunk
        ctx.translate(p.x, p.y);
        ctx.rotate(p.angle);
        ctx.fillStyle = p.color;
        ctx.fillRect(-p.size * 0.5, -p.size * 0.4, p.size, p.size * 0.8);
      } else if (p.type === 'toxic_steam' || p.type === 'blood_mist' || p.type === 'coolant_puff' || p.type === 'smoke_puff') {
        // Soft radial vapor cloud
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        ctx.fill();
      } else if (p.type === 'impact_flash') {
        // Dynamic impact dot
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
      } else {
        // Fallback generic particle
        ctx.fillStyle = p.color || '#ffffff';
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size || 2, 0, Math.PI * 2);
        ctx.fill();
      }

      ctx.restore();
    }

    // Draw floating texts
    for (const ft of this.floatingTexts) {
      const alpha = Math.max(0, ft.life / ft.maxLife);
      ctx.save();
      ctx.font = 'bold 12px "Courier New", monospace';
      ctx.fillStyle = ft.color;
      ctx.shadowColor = '#000000';
      ctx.shadowBlur = 5;
      ctx.globalAlpha = alpha;
      ctx.fillText(ft.text, ft.x, ft.y);
      ctx.restore();
    }
  }

  // Supersonic gold tracer — .50 BMG bolt-action
  spawnSniperTracer(x1, y1, x2, y2, headshot) {
    // Tracer line segments (fading)
    const dx = x2 - x1, dy = y2 - y1;
    const len = Math.sqrt(dx * dx + dy * dy);
    const steps = Math.floor(len / 22);
    for (let i = 0; i <= steps; i++) {
      const t = i / Math.max(steps, 1);
      this.particles.push({
        x: x1 + dx * t + (Math.random() - 0.5) * 1.4,
        y: y1 + dy * t + (Math.random() - 0.5) * 1.4,
        vx: dx * 0.015 + (Math.random() - 0.5) * 0.5,
        vy: dy * 0.015 + (Math.random() - 0.5) * 0.5,
        life: 0.22 - t * 0.12,
        maxLife: 0.22,
        size: headshot ? 2.8 : 1.8,
        color: headshot ? '#FFD700' : '#FFC04A',
        gravity: 0,
        type: 'tracer'
      });
    }
    // Muzzle flash at sniper origin
    for (let i = 0; i < 8; i++) {
      const a = Math.random() * Math.PI * 2;
      const spd = Math.random() * 2.5 + 1;
      this.particles.push({
        x: x1, y: y1,
        vx: Math.cos(a) * spd, vy: Math.sin(a) * spd,
        life: 0.08, maxLife: 0.08,
        size: Math.random() * 3 + 1.5,
        color: '#FFFBE0', gravity: 0, type: 'muzzle'
      });
    }
    // Spent casing ejection (right-side eject)
    this.spawnCasing(x1 + 4, y1, 1);
    // Floating damage text
    const label = headshot ? `HEADSHOT! -${Math.floor(Math.random()*140+310)}` : `-${Math.floor(Math.random()*120+180)}`;
    const col = headshot ? '#FFD700' : '#FF6633';
    this.addFloatingText(x2, y2 - 20, label, col);
  }

  // Floating kill/damage text
  addFloatingText(x, y, text, color) {
    if (!this.floatingTexts) this.floatingTexts = [];
    this.floatingTexts.push({ x, y, text, color, life: 1.2, maxLife: 1.2 });
  }
}

window.ParticleSystem = ParticleSystem;


// --- turrets.js ---
// Automated Defensive Turrets System with Target Prioritization, Armor Penetration, and Manual Crosshair Control
class Turret {
  constructor(side, x, y) {
    this.side = side; // 'left' or 'right'
    this.x = x;
    this.y = y;
    this.tierIndex = 0;
    this.stats = { ...CONFIG.TURRET_TIERS[0] };
    this.ammo = this.stats.maxAmmo;
    this.health = 100;
    this.maxHealth = 100;
    this.angle = side === 'left' ? Math.PI : 0; // Default facing outward
    this.targetAngle = this.angle;
    this.target = null;
    this.cooldown = 0;
    this.recoil = 0;
    this.isReloading = false;
    this.reloadTimer = 0;
    this.autoFire = true;
    this.kills = 0;

    // Target Prioritization: 'nearest', 'lowest_hp', 'strongest', 'boss'
    this.priorityMode = 'nearest';
    this.wasTargeting = false;

    // Mechanical animation state variables
    this.barrelSpinAngle = 0; // For Tier 3 Minigun rotating cluster
    this.spinSpeed = 0;       // Rotation speed in rad/sec
    this.plasmaArcTimer = 0;  // For Tier 4 Plasma induction arcs
    this.plasmaArcs = [];     // Dynamic cyan micro-arcs leaping between rails
    this.activeBarrel = 0;    // Alternating barrel fire for Twin Autocannon
  }

  setPriority(mode) {
    const validModes = ['nearest', 'lowest_hp', 'strongest', 'boss'];
    if (validModes.includes(mode)) {
      this.priorityMode = mode;
      if (window.gameEngine) {
        window.gameEngine.particles.addFloatingText(`PRIORITY: ${mode.toUpperCase()}`, this.x - 30, this.y - 30, '#ffd700');
      }
    }
  }

  cyclePriority() {
    const modes = ['nearest', 'lowest_hp', 'strongest', 'boss'];
    const idx = modes.indexOf(this.priorityMode);
    this.priorityMode = modes[(idx + 1) % modes.length];
    if (window.soundSystem) window.soundSystem.playBeep(true);
    if (window.gameEngine) {
      window.gameEngine.particles.addFloatingText(`PRIORITY: ${this.priorityMode.toUpperCase()}`, this.x - 30, this.y - 30, '#ffd700');
    }
  }

  upgrade() {
    if (this.tierIndex < CONFIG.TURRET_TIERS.length - 1) {
      const nextTier = CONFIG.TURRET_TIERS[this.tierIndex + 1];
      const cost = nextTier.upgradeCost;
      const res = window.gameEngine.resources;

      // Check resource cost
      if (res.metal >= cost.metal && (!cost.gunpowder || res.gunpowder >= cost.gunpowder)) {
        res.metal -= cost.metal;
        if (cost.gunpowder) res.gunpowder -= cost.gunpowder;
        this.tierIndex++;
        this.stats = { ...CONFIG.TURRET_TIERS[this.tierIndex] };
        this.ammo = this.stats.maxAmmo;
        this.maxHealth += 50;
        this.health = this.maxHealth;
        window.soundSystem.playBeep(true);
        window.gameEngine.particles.spawnSparks(this.x, this.y, 25, '#44ffaa');
        window.gameEngine.particles.addFloatingText("UPGRADED!", this.x - 20, this.y - 30, '#44ffaa');
        return true;
      }
    }
    window.soundSystem.playBeep(false);
    return false;
  }

  repair() {
    const res = window.gameEngine.resources;
    if (this.health < this.maxHealth && res.metal >= 10) {
      res.metal -= 10;
      this.health = Math.min(this.maxHealth, this.health + 40);
      window.soundSystem.playBeep(true);
      window.gameEngine.particles.spawnSparks(this.x, this.y, 15, '#ffaa33');
      window.gameEngine.particles.addFloatingText("+40 HP REPAIRED", this.x - 30, this.y - 25, '#ffaa33');
      return true;
    }
    return false;
  }

  reload() {
    if (this.isReloading || this.ammo >= this.stats.maxAmmo) return false;
    const res = window.gameEngine.resources;
    const needed = this.stats.maxAmmo - this.ammo;
    const loadAmount = Math.min(needed, res.ammo);

    if (loadAmount > 0) {
      this.isReloading = true;
      this.reloadTimer = 1.0; // 1s reload delay
      res.ammo -= loadAmount;
      this.pendingAmmo = loadAmount;
      window.soundSystem.playReload();
      window.gameEngine.particles.addFloatingText("RELOADING...", this.x - 25, this.y - 25, '#ffe57f');
      return true;
    } else {
      window.soundSystem.playDryClick();
      window.gameEngine.particles.addFloatingText("OUT OF AMMO STOCK!", this.x - 40, this.y - 25, '#ff4444');
      return false;
    }
  }

  calculateDamage(target) {
    let rawDamage = this.stats.damage * (1 + (Math.random() * 0.2 - 0.1));
    const engine = window.gameEngine;
    if (engine && engine.techTree.heavyCaliber) {
      rawDamage *= 1.3;
    }

    // Critical Hit calculation (15% chance for +50% damage)
    const isCrit = Math.random() < 0.15;
    if (isCrit) {
      rawDamage *= 1.5;
    }

    // Armor Penetration calculation vs Riot Armored
    if (target && target.typeKey === 'armored') {
      let ap = 0.15; // Tier 0 base AP
      if (this.tierIndex === 1) ap = 0.50; // Autocannon
      else if (this.tierIndex === 2) ap = 0.75; // Vulcan Minigun
      else if (this.tierIndex === 3) ap = 1.00; // Plasma Cannon

      if (engine && engine.techTree.heavyCaliber) ap += 0.35;
      ap = Math.min(1.0, ap);

      // Armored zombies take reduced damage if low AP
      const armorReduction = 0.5 + 0.5 * ap;
      rawDamage *= armorReduction;
    }

    return { damage: rawDamage, isCrit };
  }

  update(dt, zombies) {
    // Handle reload timer
    if (this.isReloading) {
      this.reloadTimer -= dt;
      if (this.reloadTimer <= 0) {
        this.ammo += this.pendingAmmo;
        this.pendingAmmo = 0;
        this.isReloading = false;
        window.gameEngine.particles.addFloatingText(`+${this.ammo} READY!`, this.x - 20, this.y - 25, '#55ff55');
      }
    }

    if (this.cooldown > 0) {
      this.cooldown -= dt;
    }
    if (this.recoil > 0) {
      this.recoil = Math.max(0, this.recoil - dt * 26);
    }

    // Minigun barrel cluster rotation physics
    if (this.tierIndex === 2) {
      const isTargeting = (this.target && this.target.hp > 0) || (window.gameEngine && window.gameEngine.manualAim);
      if (isTargeting && this.ammo > 0) {
        // Accelerate barrel spin
        this.spinSpeed = Math.min(48, this.spinSpeed + dt * 55);
      } else {
        // Decelerate smoothly
        this.spinSpeed = Math.max(0, this.spinSpeed - dt * 22);
      }
      this.barrelSpinAngle += this.spinSpeed * dt;
    }

    // Plasma Cannon induction coil electrical arc generator
    if (this.tierIndex === 3) {
      this.plasmaArcTimer -= dt;
      if (this.plasmaArcTimer <= 0) {
        this.plasmaArcTimer = 0.08 + Math.random() * 0.12;
        this.plasmaArcs = [];
        const count = 2 + Math.floor(Math.random() * 3);
        for (let i = 0; i < count; i++) {
          this.plasmaArcs.push({
            x1: 6 + Math.random() * 16,
            y1: -6 + Math.random() * 2,
            x2: 6 + Math.random() * 16,
            y2: 4 + Math.random() * 2,
            life: 0.1
          });
        }
      }
    }

    // Auto-reload from bunker if auto-conduit tech researched
    if (window.gameEngine.techTree.autoConduit && this.ammo < this.stats.maxAmmo * 0.3 && !this.isReloading) {
      this.reload();
    }

    const engine = window.gameEngine;
    const isManual = engine && engine.manualAim;

    if (isManual) {
      // Manual aiming mode: rotate towards mouse cursor
      this.targetAngle = Math.atan2(engine.mouseY - this.y, engine.mouseX - this.x);
      let diff = this.targetAngle - this.angle;
      while (diff < -Math.PI) diff += Math.PI * 2;
      while (diff > Math.PI) diff -= Math.PI * 2;
      this.angle += diff * Math.min(1, dt * 18);
      this.target = null;
      return;
    }

    // Autonomous Mode: Find Target based on Priority
    this.findTarget(zombies);

    // Aim smoothly towards target
    if (this.target && this.target.hp > 0) {
      const targetCenterY = this.target.y - this.target.size;
      this.targetAngle = Math.atan2(targetCenterY - this.y, this.target.x - this.x);

      let diff = this.targetAngle - this.angle;
      while (diff < -Math.PI) diff += Math.PI * 2;
      while (diff > Math.PI) diff -= Math.PI * 2;
      this.angle += diff * Math.min(1, dt * 14);

      // Minigun spinup audio hook
      if (!this.wasTargeting && this.tierIndex === 2 && window.soundSystem && window.soundSystem.playMinigunSpinup) {
        window.soundSystem.playMinigunSpinup();
      }
      this.wasTargeting = true;

      // Auto Fire if aligned and in range
      if (this.autoFire && Math.abs(diff) < 0.35 && this.cooldown <= 0 && !this.isReloading) {
        this.fire();
      }
    } else {
      this.wasTargeting = false;
      // Idle resting angle
      const defaultAngle = this.side === 'left' ? Math.PI : 0;
      let diff = defaultAngle - this.angle;
      while (diff < -Math.PI) diff += Math.PI * 2;
      while (diff > Math.PI) diff -= Math.PI * 2;
      this.angle += diff * Math.min(1, dt * 4);
    }
  }

  findTarget(zombies) {
    const candidates = [];
    for (const z of zombies) {
      if (z.hp <= 0) continue;
      // Flank preference
      if (this.side === 'left' && z.x > 670) continue;
      if (this.side === 'right' && z.x < 610) continue;

      const dist = Math.hypot(z.x - this.x, z.y - this.y);
      if (dist <= this.stats.range) {
        candidates.push({ zombie: z, dist });
      }
    }

    if (candidates.length === 0) {
      this.target = null;
      return;
    }

    // Apply prioritization mode
    if (this.priorityMode === 'nearest') {
      candidates.sort((a, b) => a.dist - b.dist);
    } else if (this.priorityMode === 'lowest_hp') {
      candidates.sort((a, b) => a.zombie.hp - b.zombie.hp);
    } else if (this.priorityMode === 'strongest') {
      candidates.sort((a, b) => b.zombie.maxHp - a.zombie.maxHp);
    } else if (this.priorityMode === 'boss') {
      const typeRank = { brute: 4, spitter: 3, armored: 2, runner: 1, shambler: 0 };
      candidates.sort((a, b) => {
        const rankA = typeRank[a.zombie.typeKey] || 0;
        const rankB = typeRank[b.zombie.typeKey] || 0;
        if (rankB !== rankA) return rankB - rankA;
        return a.dist - b.dist;
      });
    }

    this.target = candidates[0].zombie;
  }

  fire() {
    if (this.ammo <= 0) {
      window.soundSystem.playDryClick();
      this.cooldown = 0.6;
      window.gameEngine.particles.addFloatingText("NO AMMO!", this.x - 20, this.y - 20, '#ff4444');
      return;
    }

    this.ammo--;
    this.cooldown = this.stats.fireRate;
    this.recoil = this.tierIndex === 3 ? 8 : this.tierIndex === 1 ? 7.5 : 5.5;
    this.activeBarrel = (this.activeBarrel + 1) % 2;

    // Gunshot audio
    if (this.tierIndex === 3) {
      window.soundSystem.playGunshot('plasma');
    } else if (this.tierIndex >= 1) {
      window.soundSystem.playGunshot('heavy');
    } else {
      window.soundSystem.playGunshot('normal');
    }

    // Muzzle flash and shell casing / coolant discharge
    const barrelLength = this.tierIndex === 0 ? 22 : this.tierIndex === 1 ? 28 : this.tierIndex === 2 ? 30 : 32;
    const nozzleX = this.x + Math.cos(this.angle) * barrelLength;
    const nozzleY = this.y + Math.sin(this.angle) * barrelLength;

    window.gameEngine.particles.spawnMuzzleFlash(nozzleX, nozzleY, this.angle, this.tierIndex);
    window.gameEngine.particles.spawnCasing(this.x, this.y, this.side === 'left' ? 1 : -1, this.tierIndex);

    // Hit calculation
    if (this.target && this.target.hp > 0) {
      const hitX = this.target.x + (Math.random() * 8 - 4);
      const hitY = this.target.y - this.target.size * 0.7 + (Math.random() * 6 - 3);

      if (this.tierIndex === 3) {
        // Plasma Ion Beam Tracer & Impact
        window.gameEngine.particles.addTracer(nozzleX, nozzleY, hitX, hitY, '#00f3ff', true);
        window.gameEngine.particles.spawnPlasmaImpact(hitX, hitY);
      } else {
        const tracerColor = this.tierIndex === 1 ? '#ffb347' : this.tierIndex === 2 ? '#ffea75' : '#ffe57f';
        window.gameEngine.particles.addTracer(nozzleX, nozzleY, hitX, hitY, tracerColor, false);

        // Armor impact ricochet sparks if target is armored
        if (this.target.typeKey === 'armored') {
          window.gameEngine.particles.spawnImpactSparks(hitX, hitY, this.angle + Math.PI, true);
        }
      }

      const { damage, isCrit } = this.calculateDamage(this.target);
      if (isCrit) {
        window.gameEngine.particles.addFloatingText("CRIT!", hitX, hitY - 15, '#ffd700');
      }

      const dead = this.target.takeDamage(damage);
      if (dead) {
        this.kills++;
        this.target = null;
      }
    } else {
      const blindX = this.x + Math.cos(this.angle) * this.stats.range;
      const blindY = this.y + Math.sin(this.angle) * this.stats.range;
      if (this.tierIndex === 3) {
        window.gameEngine.particles.addTracer(nozzleX, nozzleY, blindX, blindY, '#00f3ff', true);
      } else {
        window.gameEngine.particles.addTracer(nozzleX, nozzleY, blindX, blindY, '#ffe57f', false);
      }
    }
  }

  // Manual Trigger Fire along current crosshair angle
  fireManual(targetX, targetY) {
    if (this.cooldown > 0 || this.isReloading) return false;

    if (this.ammo <= 0) {
      window.soundSystem.playDryClick();
      this.cooldown = 0.5;
      window.gameEngine.particles.addFloatingText("OUT OF AMMO!", this.x - 20, this.y - 20, '#ff4444');
      return false;
    }

    this.ammo--;
    this.cooldown = this.stats.fireRate;
    this.recoil = this.tierIndex === 3 ? 9 : this.tierIndex === 1 ? 8 : 6;
    this.activeBarrel = (this.activeBarrel + 1) % 2;

    if (this.tierIndex === 3) {
      window.soundSystem.playGunshot('plasma');
    } else if (this.tierIndex >= 1) {
      window.soundSystem.playGunshot('heavy');
    } else {
      window.soundSystem.playGunshot('normal');
    }

    const barrelLength = this.tierIndex === 0 ? 22 : this.tierIndex === 1 ? 28 : this.tierIndex === 2 ? 30 : 32;
    const nozzleX = this.x + Math.cos(this.angle) * barrelLength;
    const nozzleY = this.y + Math.sin(this.angle) * barrelLength;

    window.gameEngine.particles.spawnMuzzleFlash(nozzleX, nozzleY, this.angle, this.tierIndex);
    window.gameEngine.particles.spawnCasing(this.x, this.y, this.side === 'left' ? 1 : -1, this.tierIndex);

    // Raycast hit detection against all active zombies
    const engine = window.gameEngine;
    let hitZombie = null;
    let minT = Infinity;

    const dirX = Math.cos(this.angle);
    const dirY = Math.sin(this.angle);

    for (const z of engine.zombies) {
      if (z.hp <= 0) continue;
      const toZx = z.x - nozzleX;
      const toZy = (z.y - z.size * 0.6) - nozzleY;
      const proj = toZx * dirX + toZy * dirY;

      if (proj > 0 && proj < this.stats.range) {
        const perpX = toZx - proj * dirX;
        const perpY = toZy - proj * dirY;
        const perpDist = Math.hypot(perpX, perpY);

        if (perpDist <= z.size * 1.3) {
          if (proj < minT) {
            minT = proj;
            hitZombie = z;
          }
        }
      }
    }

    if (hitZombie) {
      const hitX = hitZombie.x + (Math.random() * 6 - 3);
      const hitY = hitZombie.y - hitZombie.size * 0.6 + (Math.random() * 6 - 3);

      if (this.tierIndex === 3) {
        engine.particles.addTracer(nozzleX, nozzleY, hitX, hitY, '#00f3ff', true);
        engine.particles.spawnPlasmaImpact(hitX, hitY);
      } else {
        const tracerColor = this.tierIndex === 1 ? '#ffb347' : this.tierIndex === 2 ? '#ffea75' : '#ffd700';
        engine.particles.addTracer(nozzleX, nozzleY, hitX, hitY, tracerColor, false);
        if (hitZombie.typeKey === 'armored') {
          engine.particles.spawnImpactSparks(hitX, hitY, this.angle + Math.PI, true);
        }
      }

      const { damage, isCrit } = this.calculateDamage(hitZombie);
      if (isCrit) {
        engine.particles.addFloatingText("CRIT!", hitX, hitY - 15, '#ffd700');
      }

      const dead = hitZombie.takeDamage(damage);
      if (dead) this.kills++;
    } else {
      const endX = nozzleX + dirX * this.stats.range;
      const endY = nozzleY + dirY * this.stats.range;
      if (this.tierIndex === 3) {
        engine.particles.addTracer(nozzleX, nozzleY, endX, endY, '#00f3ff', true);
      } else {
        engine.particles.addTracer(nozzleX, nozzleY, endX, endY, '#ffd700', false);
      }
    }

    return true;
  }

  draw(ctx) {
    const engine = window.gameEngine;
    const isManual = engine && engine.manualAim;

    // Laser aim guide in autonomous or manual mode
    if (isManual) {
      this.drawManualLaserGuide(ctx);
    } else if (this.target && this.target.hp > 0 && this.ammo > 0) {
      this.drawLaserAimGuide(ctx);
    }

    ctx.save();
    ctx.translate(this.x, this.y);

    // ==========================================
    // 1. TRIPOD & MOUNTING BASE (Anchored to Ground)
    // ==========================================
    this.drawMountBase(ctx);

    // Health Bar underneath base
    const hpRatio = Math.max(0, this.health / this.maxHealth);
    ctx.fillStyle = '#1a0808';
    ctx.fillRect(-18, 17, 36, 4.5);
    ctx.fillStyle = hpRatio > 0.5 ? '#2ecc71' : hpRatio > 0.25 ? '#f39c12' : '#e74c3c';
    ctx.fillRect(-18, 17, 36 * hpRatio, 4.5);
    ctx.strokeStyle = '#000000';
    ctx.lineWidth = 1;
    ctx.strokeRect(-18, 17, 36, 4.5);

    // Ammo count badge
    ctx.fillStyle = this.ammo === 0 ? '#ff3838' : this.ammo < (this.stats.maxAmmo * 0.35) ? '#e58e26' : '#55efc4';
    ctx.font = 'bold 9px monospace';
    ctx.textAlign = 'center';
    ctx.fillText(`${this.ammo}/${this.stats.maxAmmo}`, 0, 31);

    // Priority badge
    ctx.fillStyle = '#a0aec0';
    ctx.font = '8px monospace';
    ctx.fillText(this.priorityMode.toUpperCase().slice(0, 4), 0, 40);

    // ==========================================
    // 2. ROTATING TURRET POD & WEAPON ASSEMBLY
    // ==========================================
    ctx.rotate(this.angle);

    const recoilOffset = -this.recoil;

    if (this.tierIndex === 0) {
      this.drawTier1Sentry(ctx, recoilOffset, isManual);
    } else if (this.tierIndex === 1) {
      this.drawTier2Autocannon(ctx, recoilOffset, isManual);
    } else if (this.tierIndex === 2) {
      this.drawTier3Minigun(ctx, recoilOffset, isManual);
    } else {
      this.drawTier4Plasma(ctx, recoilOffset, isManual);
    }

    ctx.restore();

    // Low Ammo warning blinking indicator
    if (this.ammo <= 0) {
      const blink = Math.floor(Date.now() / 300) % 2 === 0;
      if (blink) {
        ctx.fillStyle = '#ff3838';
        ctx.font = 'bold 10px monospace';
        ctx.textAlign = 'center';
        ctx.fillText("! RELOAD !", this.x, this.y - 20);
      }
    } else if (this.ammo < this.stats.maxAmmo * 0.35) {
      const blink = Math.floor(Date.now() / 400) % 2 === 0;
      if (blink) {
        ctx.fillStyle = '#e58e26';
        ctx.font = 'bold 9px monospace';
        ctx.textAlign = 'center';
        ctx.fillText("LOW AMMO", this.x, this.y - 20);
      }
    }
  }

  // Heavy Tripod & Mount Base per Tier
  drawMountBase(ctx) {
    if (this.tierIndex === 0) {
      // Tier 1: Heavy Steel Tripod with stabilizer feet
      ctx.strokeStyle = '#2d3748';
      ctx.lineWidth = 3;
      // Left leg
      ctx.beginPath();
      ctx.moveTo(-4, 4);
      ctx.lineTo(-15, 14);
      ctx.stroke();
      // Right leg
      ctx.beginPath();
      ctx.moveTo(4, 4);
      ctx.lineTo(15, 14);
      ctx.stroke();
      // Center rear strut
      ctx.beginPath();
      ctx.moveTo(0, 4);
      ctx.lineTo(0, 15);
      ctx.stroke();

      // Locking stabilizer footpads
      ctx.fillStyle = '#1a202c';
      ctx.fillRect(-18, 13, 6, 3);
      ctx.fillRect(12, 13, 6, 3);
      ctx.fillRect(-3, 14, 6, 2.5);

      // Central steel pivot pedestal
      ctx.fillStyle = '#4a5568';
      ctx.beginPath();
      ctx.arc(0, 4, 6, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = '#1a202c';
      ctx.lineWidth = 1.5;
      ctx.stroke();
    } else if (this.tierIndex === 1) {
      // Tier 2: Reinforced hydraulic swivel mount with dual chrome pistons
      ctx.fillStyle = '#2d3748';
      ctx.fillRect(-14, 6, 28, 9);
      ctx.strokeStyle = '#1a202c';
      ctx.lineWidth = 1.5;
      ctx.strokeRect(-14, 6, 28, 9);

      // Hydraulic pistons on flanks
      ctx.fillStyle = '#cbd5e0'; // Chrome piston rod
      ctx.fillRect(-11, 0, 3, 7);
      ctx.fillRect(8, 0, 3, 7);
      ctx.fillStyle = '#4a5568'; // Hydraulic cylinder
      ctx.fillRect(-12, 4, 5, 6);
      ctx.fillRect(7, 4, 5, 6);

      // Mounting plate with bolts
      ctx.fillStyle = '#718096';
      ctx.beginPath();
      ctx.arc(-10, 12, 1.5, 0, Math.PI * 2);
      ctx.arc(10, 12, 1.5, 0, Math.PI * 2);
      ctx.fill();
    } else if (this.tierIndex === 2) {
      // Tier 3: Conical heavy pedestal with recoil shocks & high-capacity chute
      ctx.fillStyle = '#1e272e';
      ctx.beginPath();
      ctx.moveTo(-16, 15);
      ctx.lineTo(16, 15);
      ctx.lineTo(9, 2);
      ctx.lineTo(-9, 2);
      ctx.closePath();
      ctx.fill();
      ctx.strokeStyle = '#2f3640';
      ctx.lineWidth = 2;
      ctx.stroke();

      // Recoil shock absorbers
      ctx.fillStyle = '#e1b12c'; // Warning collar
      ctx.fillRect(-11, 6, 4, 7);
      ctx.fillRect(7, 6, 4, 7);
      ctx.fillStyle = '#dcdde1'; // Chrome damper shaft
      ctx.fillRect(-10, 2, 2, 5);
      ctx.fillRect(8, 2, 2, 5);
    } else {
      // Tier 4: Magnetic suspension pedestal with cyan power conduits
      ctx.fillStyle = '#101721';
      ctx.beginPath();
      ctx.moveTo(-18, 15);
      ctx.lineTo(18, 15);
      ctx.lineTo(11, 2);
      ctx.lineTo(-11, 2);
      ctx.closePath();
      ctx.fill();
      ctx.strokeStyle = '#0abde3';
      ctx.lineWidth = 1.8;
      ctx.stroke();

      // Glowing power conduit cables
      ctx.strokeStyle = '#00d2d3';
      ctx.lineWidth = 2;
      ctx.shadowColor = '#00d2d3';
      ctx.shadowBlur = 6;
      ctx.beginPath();
      ctx.moveTo(-13, 14);
      ctx.quadraticCurveTo(-15, 6, -8, 3);
      ctx.moveTo(13, 14);
      ctx.quadraticCurveTo(15, 6, 8, 3);
      ctx.stroke();
      ctx.shadowBlur = 0;
    }
  }

  // Tier 1: Sentry 9mm (Dual rifled steel barrels, drum magazine, red laser sight)
  drawTier1Sentry(ctx, recoilOffset, isManual) {
    // Drum Ammo Magazine on right flank
    ctx.fillStyle = '#2f3542';
    ctx.beginPath();
    ctx.ellipse(recoilOffset - 2, 7, 6.5, 4.5, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#1e272e';
    ctx.lineWidth = 1.2;
    ctx.stroke();

    // Dual Rifled Barrels side-by-side with cooling vent slots
    ctx.fillStyle = '#1e272e';
    // Top barrel
    ctx.fillRect(recoilOffset, -4, 21, 3);
    // Bottom barrel
    ctx.fillRect(recoilOffset, 1, 21, 3);

    // Muzzle crowns
    ctx.fillStyle = '#57606f';
    ctx.fillRect(recoilOffset + 20, -4.5, 2, 4);
    ctx.fillRect(recoilOffset + 20, 0.5, 2, 4);

    // Cooling vent slots along barrel jackets
    ctx.fillStyle = '#111';
    for (let s = 6; s <= 16; s += 5) {
      ctx.fillRect(recoilOffset + s, -3.5, 2, 2);
      ctx.fillRect(recoilOffset + s, 1.5, 2, 2);
    }

    // Armored Receiver Box
    ctx.fillStyle = '#353b48';
    ctx.fillRect(recoilOffset - 9, -6, 12, 12);
    ctx.strokeStyle = '#1e272e';
    ctx.lineWidth = 1.5;
    ctx.strokeRect(recoilOffset - 9, -6, 12, 12);

    // Turret Pod Dome
    ctx.fillStyle = '#4a5568';
    ctx.beginPath();
    ctx.arc(recoilOffset * 0.5, 0, 8, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#2d3748';
    ctx.stroke();

    // Top Optical Sensor Pod & Red Laser Optic
    ctx.fillStyle = '#2d3748';
    ctx.fillRect(recoilOffset - 4, -8, 8, 3);
    ctx.fillStyle = '#ff3838'; // Ruby red sensor diode
    ctx.fillRect(recoilOffset + 2, -7.5, 2, 2);

    // Center pivot indicator LED
    ctx.fillStyle = this.isReloading ? '#fbc531' : this.ammo === 0 ? '#e84118' : isManual ? '#00f3ff' : '#4cd137';
    ctx.beginPath();
    ctx.arc(recoilOffset * 0.5, 0, 2.5, 0, Math.PI * 2);
    ctx.fill();
  }

  // Tier 2: Twin Autocannon (Fluted heavy barrels with vented muzzle brakes, linked ammo belt, amber sight)
  drawTier2Autocannon(ctx, recoilOffset, isManual) {
    // Armored Hopper Ammo Box on flank with hazard diagonal stripes
    ctx.fillStyle = '#2c3e50';
    ctx.fillRect(recoilOffset - 11, 5, 11, 9);
    ctx.strokeStyle = '#1a252f';
    ctx.strokeRect(recoilOffset - 11, 5, 11, 9);
    ctx.fillStyle = '#f1c40f'; // Hazard stripe
    ctx.fillRect(recoilOffset - 10, 7, 9, 2);

    // Linked Ammo Feed Belt feeding into receiver
    ctx.fillStyle = '#d4af37';
    for (let b = 0; b < 3; b++) {
      ctx.fillRect(recoilOffset - 8 + b * 3, 3, 2, 4);
    }

    // Dual Heavy Fluted Barrels with Recoil Dampeners
    // Independent recoil for active barrel
    const recL = this.activeBarrel === 0 ? recoilOffset : recoilOffset * 0.3;
    const recR = this.activeBarrel === 1 ? recoilOffset : recoilOffset * 0.3;

    // Barrel 1 (Upper)
    ctx.fillStyle = '#2d3436';
    ctx.fillRect(recL, -5.5, 27, 4);
    // Longitudinal fluting grooves
    ctx.fillStyle = '#1e272e';
    ctx.fillRect(recL + 4, -4.5, 18, 1);
    ctx.fillRect(recL + 4, -2.5, 18, 1);
    // Vented Muzzle Brake (vertical & lateral vents)
    ctx.fillStyle = '#636e72';
    ctx.fillRect(recL + 25, -7, 4, 7);
    ctx.fillStyle = '#111';
    ctx.fillRect(recL + 26, -6, 2, 1.5);
    ctx.fillRect(recL + 26, -3.5, 2, 1.5);

    // Barrel 2 (Lower)
    ctx.fillStyle = '#2d3436';
    ctx.fillRect(recR, 2, 27, 4);
    ctx.fillStyle = '#1e272e';
    ctx.fillRect(recR + 4, 3, 18, 1);
    ctx.fillRect(recR + 4, 5, 18, 1);
    // Vented Muzzle Brake
    ctx.fillStyle = '#636e72';
    ctx.fillRect(recR + 25, 0.5, 4, 7);
    ctx.fillStyle = '#111';
    ctx.fillRect(recR + 26, 1.5, 2, 1.5);
    ctx.fillRect(recR + 26, 4, 2, 1.5);

    // Angled Armored Gun Mantlet / Ballistic Shield
    ctx.fillStyle = '#4b6584';
    ctx.beginPath();
    ctx.moveTo(recoilOffset - 11, -11);
    ctx.lineTo(recoilOffset + 4, -7);
    ctx.lineTo(recoilOffset + 4, 7);
    ctx.lineTo(recoilOffset - 11, 11);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = '#2d3748';
    ctx.lineWidth = 1.8;
    ctx.stroke();

    // Rivet studs on mantlet
    ctx.fillStyle = '#cbd5e0';
    ctx.fillRect(recoilOffset - 9, -9, 2, 2);
    ctx.fillRect(recoilOffset - 9, 7, 2, 2);

    // Electro-optical Sensor Housing & Amber targeting lens
    ctx.fillStyle = '#1e272e';
    ctx.fillRect(recoilOffset - 2, -10, 7, 4);
    ctx.fillStyle = '#f39c12'; // Amber optic lens
    ctx.fillRect(recoilOffset + 3, -9.5, 2, 3);

    // Center LED
    ctx.fillStyle = this.isReloading ? '#fbc531' : this.ammo === 0 ? '#e84118' : isManual ? '#00f3ff' : '#4cd137';
    ctx.beginPath();
    ctx.arc(recoilOffset * 0.4, 0, 3, 0, Math.PI * 2);
    ctx.fill();
  }

  // Tier 3: Vulcan Minigun (Rotating 6-barrel cluster with rotation blur, cooling shroud, emerald sight)
  drawTier3Minigun(ctx, recoilOffset, isManual) {
    // Massive receiver body & drive motor
    ctx.fillStyle = '#2f3640';
    ctx.fillRect(recoilOffset - 14, -8, 16, 16);
    ctx.strokeStyle = '#1e272e';
    ctx.lineWidth = 1.8;
    ctx.strokeRect(recoilOffset - 14, -8, 16, 16);

    // Perforated cylindrical cooling shroud wrapping the aft barrel assembly
    ctx.fillStyle = '#1e252b';
    ctx.fillRect(recoilOffset + 2, -7.5, 14, 15);
    ctx.strokeStyle = '#353b48';
    ctx.lineWidth = 1.2;
    ctx.strokeRect(recoilOffset + 2, -7.5, 14, 15);

    // Shroud ventilation perforations
    ctx.fillStyle = '#111';
    for (let vx = 5; vx <= 13; vx += 4) {
      for (let vy = -5; vy <= 5; vy += 4) {
        ctx.fillRect(recoilOffset + vx, vy, 2, 2);
      }
    }

    // Rotating 6-Barrel Gatling Cluster with 3D cylindrical projection
    const barrelCount = 6;
    const clusterLen = 29;
    const clusterRadius = 5.2;

    // High-speed rotation blur disc when spinning fast
    if (this.spinSpeed > 14) {
      const blurAlpha = Math.min(0.5, (this.spinSpeed - 14) / 34 * 0.5);
      ctx.fillStyle = `rgba(180, 195, 205, ${blurAlpha})`;
      ctx.beginPath();
      ctx.ellipse(recoilOffset + clusterLen + 1, 0, 2.5, clusterRadius + 1.5, 0, 0, Math.PI * 2);
      ctx.fill();
    }

    // Central driveshaft spline
    ctx.fillStyle = '#111';
    ctx.fillRect(recoilOffset + 14, -1.5, clusterLen - 12, 3);

    // Render 6 individual rotating barrels sorted by depth
    const barrelRenderList = [];
    for (let b = 0; b < barrelCount; b++) {
      const bAngle = this.barrelSpinAngle + (b * Math.PI * 2 / barrelCount);
      const bY = Math.sin(bAngle) * clusterRadius;
      const bDepth = Math.cos(bAngle); // -1 (far back) to +1 (near front)
      barrelRenderList.push({ bY, bDepth });
    }
    // Sort so rear barrels draw first
    barrelRenderList.sort((a, b) => a.bDepth - b.bDepth);

    for (const b of barrelRenderList) {
      // Shading based on depth
      const shade = b.bDepth > 0 ? '#4a5568' : '#1e272e';
      ctx.fillStyle = shade;
      ctx.fillRect(recoilOffset + 14, b.bY - 1.2, clusterLen - 13, 2.4);

      // Barrel tip bore
      ctx.fillStyle = '#111';
      ctx.fillRect(recoilOffset + clusterLen, b.bY - 1, 1.5, 2);
    }

    // Front barrel clamp disc & mid stabilizer ring
    ctx.fillStyle = '#718096';
    ctx.fillRect(recoilOffset + clusterLen - 1, -clusterRadius - 1, 2, (clusterRadius + 1) * 2);
    ctx.fillRect(recoilOffset + 21, -clusterRadius - 0.5, 2, (clusterRadius + 0.5) * 2);

    // Emerald Green Tactical Laser Sight Pod
    ctx.fillStyle = '#1a202c';
    ctx.fillRect(recoilOffset - 6, -11, 8, 3.5);
    ctx.fillStyle = '#00ff88'; // Emerald optic diode
    ctx.shadowColor = '#00ff88';
    ctx.shadowBlur = 5;
    ctx.fillRect(recoilOffset + 1, -10.5, 2.5, 2.5);
    ctx.shadowBlur = 0;

    // Turret Pod Center Hub
    ctx.fillStyle = '#353b48';
    ctx.beginPath();
    ctx.arc(recoilOffset * 0.4, 0, 7.5, 0, Math.PI * 2);
    ctx.fill();

    // Center LED
    ctx.fillStyle = this.isReloading ? '#fbc531' : this.ammo === 0 ? '#e84118' : isManual ? '#00f3ff' : '#00ff88';
    ctx.beginPath();
    ctx.arc(recoilOffset * 0.4, 0, 2.5, 0, Math.PI * 2);
    ctx.fill();
  }

  // Tier 4: Heavy Plasma Cannon (Magnetic rails, twin charging induction coils, cyan arcs, plasma emitter)
  drawTier4Plasma(ctx, recoilOffset, isManual) {
    // Futuristic stealth composite armor chassis with heat sinks
    ctx.fillStyle = '#101721';
    ctx.fillRect(recoilOffset - 15, -9, 17, 18);
    ctx.strokeStyle = '#0abde3';
    ctx.lineWidth = 1.8;
    ctx.strokeRect(recoilOffset - 15, -9, 17, 18);

    // Rear cooling heat sink fins with cyan glow
    ctx.fillStyle = '#00d2d3';
    ctx.shadowColor = '#00d2d3';
    ctx.shadowBlur = 6;
    for (let f = -12; f <= -4; f += 4) {
      ctx.fillRect(recoilOffset + f, -11, 2, 2);
      ctx.fillRect(recoilOffset + f, 9, 2, 2);
    }
    ctx.shadowBlur = 0;

    // Dual Magnetic Accelerator Rails (Upper & Lower)
    const railLen = 32;
    // Upper rail
    ctx.fillStyle = '#2c3e50';
    ctx.fillRect(recoilOffset + 2, -8, railLen, 3.5);
    ctx.fillStyle = '#00f3ff'; // Hyper-conductive inner guide strip
    ctx.fillRect(recoilOffset + 2, -5.5, railLen, 1.2);

    // Lower rail
    ctx.fillStyle = '#2c3e50';
    ctx.fillRect(recoilOffset + 2, 4.5, railLen, 3.5);
    ctx.fillStyle = '#00f3ff';
    ctx.fillRect(recoilOffset + 2, 4.5, railLen, 1.2);

    // Twin Charging Induction Coils wrapped around the rails
    for (const cx of [8, 15]) {
      // Upper coil
      ctx.fillStyle = '#e67e22'; // Heavy copper winding
      ctx.fillRect(recoilOffset + cx, -9.5, 4.5, 6);
      ctx.fillStyle = '#00f3ff'; // Glowing superconductive ring
      ctx.fillRect(recoilOffset + cx + 1.5, -9.5, 1.5, 6);

      // Lower coil
      ctx.fillStyle = '#e67e22';
      ctx.fillRect(recoilOffset + cx, 3.5, 4.5, 6);
      ctx.fillStyle = '#00f3ff';
      ctx.fillRect(recoilOffset + cx + 1.5, 3.5, 1.5, 6);
    }

    // Pulsing Cyan Electrical Arc Particles leaping dynamically across the rails
    ctx.strokeStyle = '#00f3ff';
    ctx.lineWidth = 1.3;
    ctx.shadowColor = '#00f3ff';
    ctx.shadowBlur = 8;
    for (const arc of this.plasmaArcs) {
      ctx.beginPath();
      const midX = recoilOffset + (arc.x1 + arc.x2) * 0.5 + (Math.random() - 0.5) * 4;
      const midY = (arc.y1 + arc.y2) * 0.5 + (Math.random() - 0.5) * 4;
      ctx.moveTo(recoilOffset + arc.x1, arc.y1);
      ctx.lineTo(midX, midY);
      ctx.lineTo(recoilOffset + arc.x2, arc.y2);
      ctx.stroke();
    }
    ctx.shadowBlur = 0;

    // Glowing Plasma Emitter Throat / Flare
    const ionPulse = 0.7 + Math.sin(Date.now() / 70) * 0.3;
    ctx.fillStyle = `rgba(0, 243, 255, ${0.4 * ionPulse})`;
    ctx.beginPath();
    ctx.arc(recoilOffset + 2, 0, 7 * ionPulse, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.arc(recoilOffset + 2, 0, 3, 0, Math.PI * 2);
    ctx.fill();

    // Muzzle Emitter Rail Tips
    ctx.fillStyle = '#00f3ff';
    ctx.fillRect(recoilOffset + railLen, -7, 2, 3);
    ctx.fillRect(recoilOffset + railLen, 4, 2, 3);

    // Center Core LED
    ctx.fillStyle = this.isReloading ? '#fbc531' : this.ammo === 0 ? '#e84118' : isManual ? '#ffffff' : '#00f3ff';
    ctx.shadowColor = ctx.fillStyle;
    ctx.shadowBlur = 10;
    ctx.beginPath();
    ctx.arc(recoilOffset * 0.4, 0, 3.5, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;
  }

  drawLaserAimGuide(ctx) {
    const barrelLen = this.tierIndex === 0 ? 22 : this.tierIndex === 1 ? 28 : this.tierIndex === 2 ? 30 : 32;
    const lx = this.x + Math.cos(this.angle) * barrelLen;
    const ly = this.y + Math.sin(this.angle) * barrelLen;
    const tx = this.target.x;
    const ty = this.target.y - this.target.size * 0.6;

    let laserColor = '#ff3333';
    if (this.tierIndex === 1) laserColor = '#f39c12';
    else if (this.tierIndex === 2) laserColor = '#00ff88';
    else if (this.tierIndex === 3) laserColor = '#00f3ff';

    const shimmer = 0.72 + Math.sin(Date.now() / 60) * 0.24;

    ctx.save();
    ctx.strokeStyle = laserColor;
    ctx.lineWidth = this.tierIndex === 3 ? 1.8 : 1.2;
    ctx.shadowColor = laserColor;
    ctx.shadowBlur = this.tierIndex === 3 ? 8 : 4;
    ctx.globalAlpha = shimmer * 0.85;

    ctx.beginPath();
    ctx.moveTo(lx, ly);
    ctx.lineTo(tx, ty);
    ctx.stroke();

    // Reticle on target
    ctx.fillStyle = laserColor;
    ctx.globalAlpha = shimmer;
    ctx.beginPath();
    ctx.arc(tx, ty, 3.5, 0, Math.PI * 2);
    ctx.fill();

    // Crosshair brackets on target
    ctx.lineWidth = 1.0;
    ctx.beginPath();
    ctx.arc(tx, ty, 7.5, 0, Math.PI * 2);
    ctx.stroke();

    ctx.restore();
  }

  drawManualLaserGuide(ctx) {
    const engine = window.gameEngine;
    if (!engine) return;

    // Only draw guide for turret covering current mouse half
    if ((this.side === 'left' && engine.mouseX > 700) || (this.side === 'right' && engine.mouseX < 580)) {
      return;
    }

    const barrelLen = 30;
    const lx = this.x + Math.cos(this.angle) * barrelLen;
    const ly = this.y + Math.sin(this.angle) * barrelLen;
    const mx = engine.mouseX;
    const my = engine.mouseY;

    ctx.save();
    ctx.strokeStyle = '#00f3ff';
    ctx.lineWidth = 1.4;
    ctx.shadowColor = '#00f3ff';
    ctx.shadowBlur = 6;
    ctx.globalAlpha = 0.8;
    ctx.setLineDash([4, 4]);
    ctx.beginPath();
    ctx.moveTo(lx, ly);
    ctx.lineTo(mx, my);
    ctx.stroke();
    ctx.restore();
  }
}

window.Turret = Turret;


// --- zombies.js ---
// Zombie AI, Waves, and Spawning System
class Zombie {
  constructor(typeKey, side = 'left') {
    this.typeKey = typeKey;
    const base = CONFIG.ZOMBIE_TYPES[typeKey] || CONFIG.ZOMBIE_TYPES.shambler;
    this.name = base.name;
    this.maxHp = base.hp;
    this.hp = base.hp;
    this.speed = base.speed * (0.85 + Math.random() * 0.3);
    this.damage = base.damage;
    this.color = base.color;
    this.size = base.size;
    this.reward = base.reward;
    this.side = side;
    
    // Spawn at outer forest edge
    this.x = side === 'left' ? -15 - Math.random() * 40 : 1295 + Math.random() * 40;
    this.y = CONFIG.SURFACE_Y;

    this.walkCycle = Math.random() * Math.PI * 2;
    this.attackCooldown = 0;
    this.attackRate = 1.2;
    this.range = base.range || 25;
    this.spitCooldown = 2.0;

    this.hitFlash = 0;
    this.isDead = false;
    this.animTime = Math.random() * 10;
    this.dripTimer = Math.random();
    this.targetRefugee = null;
  }

  takeDamage(amount) {
    if (this.isDead) return true;
    this.hp -= amount;
    this.hitFlash = 0.08;
    window.gameEngine.particles.spawnBlood(this.x, this.y - this.size * 0.6, 5);
    window.soundSystem.playZombieHit();

    if (this.hp <= 0) {
      this.hp = 0;
      this.isDead = true;
      this.die();
      return true;
    }
    return false;
  }

  die() {
    const bloodColor = this.typeKey === 'spitter' ? '#337719' : '#6b1111';
    window.gameEngine.particles.spawnBlood(this.x, this.y - this.size * 0.5, 14, bloodColor);

    // Persistent ground blood decal
    const decalRadius = this.typeKey === 'brute' ? 14 : this.size * 0.45;
    const splatCount = this.typeKey === 'brute' ? 8 : 5;
    window.gameEngine.particles.spawnBloodDecal(this.x, CONFIG.SURFACE_Y, bloodColor, decalRadius, splatCount);

    if (this.typeKey === 'brute') {
      window.soundSystem.playExplosion();
      window.gameEngine.particles.spawnSparks(this.x, this.y - 15, 30, '#ff4422');
    }

    // Award resources
    if (this.reward) {
      if (this.reward.metal) {
        window.gameEngine.resources.metal = Math.min(
          CONFIG.RESOURCE_CAPS.metal,
          window.gameEngine.resources.metal + this.reward.metal
        );
        window.gameEngine.particles.addFloatingText(`+${this.reward.metal} Metal`, this.x - 15, this.y - 30, '#9cdcfe');
      }
      if (this.reward.gunpowder) {
        window.gameEngine.resources.gunpowder = Math.min(
          CONFIG.RESOURCE_CAPS.gunpowder,
          window.gameEngine.resources.gunpowder + this.reward.gunpowder
        );
        window.gameEngine.particles.addFloatingText(`+${this.reward.gunpowder} Powder`, this.x + 10, this.y - 45, '#e0aaff');
      }
    }

    // Chance to drop bonus ammo crate
    if (Math.random() < 0.25) {
      const dropAmmo = 10 + Math.floor(Math.random() * 15);
      window.gameEngine.resources.ammo = Math.min(
        CONFIG.RESOURCE_CAPS.ammo,
        window.gameEngine.resources.ammo + dropAmmo
      );
      window.gameEngine.particles.addFloatingText(`+${dropAmmo} AMMO!`, this.x, this.y - 55, '#f1c40f');
    }

    window.gameEngine.stats.zombiesKilled++;
  }

  update(dt) {
    if (this.isDead) return;

    this.animTime = (this.animTime || 0) + dt;
    this.dripTimer = (this.dripTimer || 0) + dt;

    if (this.hitFlash > 0) {
      this.hitFlash -= dt;
    }
    if (this.attackCooldown > 0) {
      this.attackCooldown -= dt;
    }
    this.walkCycle += dt * 5;

    // Goliath Brute ground-shaking footstep dust puffs
    if (this.typeKey === 'brute') {
      const prevStep = Math.sin(this.walkCycle - dt * 5);
      const curStep = Math.sin(this.walkCycle);
      if (prevStep < 0 && curStep >= 0) {
        if (window.gameEngine && window.gameEngine.particles) {
          if (window.gameEngine.particles.spawnDustPuff) {
            window.gameEngine.particles.spawnDustPuff(this.x, CONFIG.SURFACE_Y, 7, 'rgba(150, 135, 120, 0.6)');
          } else if (window.gameEngine.particles.spawnSmokePuff) {
            window.gameEngine.particles.spawnSmokePuff(this.x, CONFIG.SURFACE_Y, 7, 'rgba(150, 135, 120, 0.6)');
          }
        }
      }
    }

    // If assigned to pursue a fleeing refugee on surface
    if (this.targetRefugee) {
      if (this.targetRefugee.isDead || this.targetRefugee.isRescued) {
        this.targetRefugee = null;
      } else {
        const distToRefugee = Math.abs(this.x - this.targetRefugee.x);
        if (distToRefugee <= 20) {
          if (this.attackCooldown <= 0) {
            this.attackCooldown = this.attackRate;
            this.targetRefugee.takeDamage(this.damage);
            if (window.soundSystem && window.soundSystem.playZombieShriek) {
              window.soundSystem.playZombieShriek();
            }
          }
        } else {
          const dir = this.x < this.targetRefugee.x ? 1 : -1;
          this.x += dir * (this.speed * 1.05) * dt;
        }
        return;
      }
    }

    // Target is house center (x: 640) or flanking turrets (x: 430 or 850)
    const targetX = this.side === 'left' ? 440 : 840;
    const houseX = 640;

    // Distance to turret
    const distToTurret = Math.abs(this.x - targetX);
    const distToHouse = Math.abs(this.x - houseX);

    // Spitter logic: stops at range and spits acid
    if (this.typeKey === 'spitter' && distToTurret <= this.range) {
      this.spitCooldown -= dt;
      if (this.spitCooldown <= 0) {
        this.spitCooldown = 2.5;
        const targetTurret = this.side === 'left' ? window.gameEngine.leftTurret : window.gameEngine.rightTurret;
        if (window.soundSystem && window.soundSystem.playAcidSpit) {
          window.soundSystem.playAcidSpit();
        }
        window.gameEngine.particles.spawnAcidSpit(this.x, this.y - this.size * 0.8, targetTurret.x, targetTurret.y, this.damage);
      }
      return;
    }

    // Check if reached turret or barricade
    const inMeleeRange = distToTurret <= 18 || distToHouse <= 45;
    if (inMeleeRange) {
      if (this.attackCooldown <= 0) {
        this.attackCooldown = this.attackRate;
        const targetTurret = this.side === 'left' ? window.gameEngine.leftTurret : window.gameEngine.rightTurret;
        
        if (window.soundSystem && window.soundSystem.playZombieShriek) {
          window.soundSystem.playZombieShriek();
        }

        // Attack turret if alive, otherwise attack house
        if (targetTurret.health > 0 && distToTurret <= 25) {
          targetTurret.health = Math.max(0, targetTurret.health - this.damage);
          window.gameEngine.particles.spawnSparks(targetTurret.x, targetTurret.y, 8, '#ff5533');
          window.gameEngine.particles.addFloatingText(`-${this.damage}`, targetTurret.x - 10, targetTurret.y - 20, '#ff3333');
        } else {
          window.gameEngine.damageHouse(this.damage);
          window.gameEngine.particles.spawnBlood(this.x, this.y - 10, 4, '#552222');
        }
      }
    } else {
      // Move towards center
      const dir = this.side === 'left' ? 1 : -1;
      this.x += dir * this.speed * dt;
    }
  }

  draw(ctx) {
    if (this.isDead) return;

    ctx.save();
    ctx.translate(this.x, this.y);

    // Direction flip: face toward base center
    const faceLeft = this.side === 'right';
    if (faceLeft) ctx.scale(-1, 1);

    // Flash bright white when hit by bullets
    if (this.hitFlash > 0) {
      ctx.filter = 'brightness(2.6)';
    }

    const bob = Math.sin(this.walkCycle) * 2.5;
    const legSwing = Math.cos(this.walkCycle) * (this.typeKey === 'runner' ? 7.5 : 5);

    // Dispatch specialized procedural archetype rendering
    if (this.typeKey === 'brute') {
      this.drawGoliathBrute(ctx, bob, legSwing);
    } else if (this.typeKey === 'spitter') {
      this.drawAcidSpitter(ctx, bob);
    } else if (this.typeKey === 'armored') {
      this.drawRiotArmored(ctx, bob, legSwing);
    } else if (this.typeKey === 'runner') {
      this.drawFeralRunner(ctx, bob, legSwing);
    } else {
      this.drawShambler(ctx, bob);
    }

    // Health bar above zombie
    if (this.hp < this.maxHp) {
      const barW = this.size * 1.35;
      const hpRatio = Math.max(0, this.hp / this.maxHp);
      const barY = this.typeKey === 'brute' ? -this.size * 1.6 + bob : -this.size * 1.48 + bob;
      ctx.fillStyle = '#220505';
      ctx.fillRect(-barW / 2, barY, barW, 3.2);
      ctx.fillStyle = hpRatio > 0.5 ? '#2ecc71' : hpRatio > 0.25 ? '#f39c12' : '#e74c3c';
      ctx.fillRect(-barW / 2, barY, barW * hpRatio, 3.2);
    }

    ctx.restore();
  }

  // --- 1. SHAMBLER (WALKER): Decaying flesh, torn bloody shirt, exposed ribcage, limp dragging leg, open jaw dripping blood ---
  drawShambler(ctx, bob) {
    // Asymmetrical Limp Dragging Walk Cycle:
    // Leading foot steps forward, trailing limp foot drags along the ground with friction mark
    const leadSwing = Math.cos(this.walkCycle) * 4.2;
    const limpDrag = -this.size * 0.38 - Math.abs(Math.sin(this.walkCycle * 0.5)) * 1.6;

    // Torso tilts heavily sideways into the limp
    ctx.rotate(Math.sin(this.walkCycle) * 0.08);

    // Dragging Limp Leg (back leg scraping ground)
    ctx.strokeStyle = '#222f21';
    ctx.lineWidth = 2.8;
    ctx.beginPath();
    ctx.moveTo(-2, -this.size * 0.42);
    ctx.lineTo(limpDrag, 0);
    ctx.stroke();

    // Ground scrape friction streak
    ctx.strokeStyle = 'rgba(50, 30, 15, 0.45)';
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    ctx.moveTo(limpDrag - 2, 0);
    ctx.lineTo(limpDrag + 2.5, 0);
    ctx.stroke();

    // Leading Step Leg (front leg stepping naturally)
    ctx.strokeStyle = '#2d3b2c';
    ctx.lineWidth = 2.8;
    ctx.beginPath();
    ctx.moveTo(2, -this.size * 0.42);
    ctx.lineTo(3 - leadSwing, 0);
    ctx.stroke();

    // Decaying Rotten Flesh Torso
    const torsoW = this.size * 0.72;
    const torsoH = this.size * 0.62;
    ctx.fillStyle = '#4a6744'; // Decaying greenish-grey flesh
    ctx.fillRect(-torsoW / 2, -this.size * 0.92 + bob, torsoW, torsoH);

    // Putrid necrotic dark flesh patches
    ctx.fillStyle = '#2f442b';
    ctx.fillRect(-torsoW * 0.35, -this.size * 0.82 + bob, 3, 4);

    // Torn Bloody Shirt shreds hanging over shoulders and hem
    ctx.fillStyle = '#612b2b';
    ctx.fillRect(-torsoW / 2, -this.size * 0.92 + bob, torsoW * 0.5, 4);
    ctx.fillStyle = '#3a0e0e';
    ctx.fillRect(-torsoW / 2, -this.size * 0.42 + bob, torsoW, 2.5); // Frayed bloody hem

    // Exposed Ribcage: Deep crimson wound cavity with calcified ivory rib bones
    ctx.fillStyle = '#2a0404'; // Clotted thoracic cavity
    ctx.fillRect(-1, -this.size * 0.82 + bob, torsoW * 0.5, 6);

    // Calcified rib bones curving across the cavity
    ctx.strokeStyle = '#eae3d2'; // Bone white
    ctx.lineWidth = 1.1;
    ctx.beginPath();
    ctx.moveTo(-0.5, -this.size * 0.8 + bob); ctx.lineTo(torsoW * 0.45, -this.size * 0.81 + bob);
    ctx.moveTo(-0.5, -this.size * 0.75 + bob); ctx.lineTo(torsoW * 0.45, -this.size * 0.76 + bob);
    ctx.moveTo(-0.5, -this.size * 0.7 + bob); ctx.lineTo(torsoW * 0.45, -this.size * 0.71 + bob);
    ctx.moveTo(-0.5, -this.size * 0.65 + bob); ctx.lineTo(torsoW * 0.45, -this.size * 0.66 + bob);
    ctx.stroke();

    // Rotten reaching arm with clawing fingers
    ctx.strokeStyle = '#3e563b';
    ctx.lineWidth = 2.6;
    ctx.beginPath();
    ctx.moveTo(0, -this.size * 0.75 + bob);
    ctx.lineTo(this.size * 0.75, -this.size * 0.62 + bob);
    ctx.lineTo(this.size * 0.88, -this.size * 0.66 + bob);
    ctx.stroke();

    // Decayed Skull
    ctx.fillStyle = '#4c6e51';
    ctx.beginPath();
    ctx.arc(0, -this.size * 1.12 + bob, this.size * 0.35, 0, Math.PI * 2);
    ctx.fill();

    // Sunken nasal cavity
    ctx.fillStyle = '#1c281e';
    ctx.fillRect(this.size * 0.1, -this.size * 1.1 + bob, 1.8, 1.8);

    // Slack Dislocated Jaw dangling open
    ctx.fillStyle = '#1a0505'; // Gaping dark mouth
    ctx.fillRect(this.size * 0.05, -this.size * 0.98 + bob, 4.5, 3.5);
    ctx.fillStyle = '#f1c40f'; // Broken tooth stump
    ctx.fillRect(this.size * 0.1, -this.size * 0.98 + bob, 1.2, 1.2);

    // Open jaw dripping blood droplets down onto chest & ground
    const dripProg = (this.walkCycle * 0.65) % 1.0;
    const dropY = -this.size * 0.88 + bob + dripProg * (this.size * 0.88);
    ctx.fillStyle = '#8b0000';
    ctx.beginPath();
    ctx.arc(this.size * 0.2, dropY, 1.3 * (1 - dripProg * 0.3), 0, Math.PI * 2);
    ctx.fill();

    // Left eye: hollow black void; Right eye: chilling bloodshot red pinprick
    ctx.fillStyle = '#111111';
    ctx.beginPath();
    ctx.arc(this.size * 0.05, -this.size * 1.16 + bob, 1.4, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = '#ff2222';
    ctx.beginPath();
    ctx.arc(this.size * 0.22, -this.size * 1.16 + bob, 1.6, 0, Math.PI * 2);
    ctx.fill();
  }

  // --- 2. FERAL RUNNER: Emaciated low predatory sprint, frantic clawing arms, ragged hoodie, glowing red eye-trails ---
  drawFeralRunner(ctx, bob, legSwing) {
    // Low predatory sprint rake forward
    ctx.rotate(0.28);

    // Emaciated sprint stride legs
    const sprintLegSwing = Math.cos(this.walkCycle * 1.6) * 9.0;
    ctx.strokeStyle = '#2d1414';
    ctx.lineWidth = 2.4;
    ctx.beginPath();
    ctx.moveTo(-3, -this.size * 0.38);
    ctx.lineTo(-4 + sprintLegSwing, 0);
    ctx.moveTo(3, -this.size * 0.38);
    ctx.lineTo(4 - sprintLegSwing, 0);
    ctx.stroke();

    // Gaunt emaciated torso with sharp vertebral ridges
    const torsoW = this.size * 0.64;
    const torsoH = this.size * 0.52;
    ctx.fillStyle = '#4a1212';
    ctx.fillRect(-torsoW / 2, -this.size * 0.82 + bob, torsoW, torsoH);

    // Protruding sharp bony spine ridges along hunched back
    ctx.fillStyle = '#260808';
    for (let s = 0; s < 4; s++) {
      ctx.fillRect(-torsoW / 2 + s * 3.5, -this.size * 0.86 + bob, 2, 2.5);
    }

    // Blood-soaked ragged hoodie: torn hood cowl fluttering behind in slipstream
    ctx.fillStyle = '#3a0c0c';
    ctx.beginPath();
    ctx.moveTo(-this.size * 0.05, -this.size * 1.1 + bob);
    ctx.lineTo(-this.size * 0.65, -this.size * 1.22 + bob + Math.sin(this.walkCycle * 2) * 2.5);
    ctx.lineTo(-this.size * 0.15, -this.size * 0.85 + bob);
    ctx.fill();

    // Frantic Clawing Arms with elongated obsidian razor talons
    const clawSwing = Math.cos(this.walkCycle * 1.6) * 8.5;
    ctx.strokeStyle = '#5a1d1d';
    ctx.lineWidth = 2.2;

    // Back claw arm
    ctx.beginPath();
    ctx.moveTo(-2, -this.size * 0.72 + bob);
    ctx.lineTo(this.size * 0.65, -this.size * 0.48 + bob - clawSwing);
    ctx.stroke();
    // Talons
    ctx.strokeStyle = '#0d0d0d';
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    ctx.moveTo(this.size * 0.65, -this.size * 0.48 + bob - clawSwing);
    ctx.lineTo(this.size * 0.85, -this.size * 0.52 + bob - clawSwing);
    ctx.stroke();

    // Front claw arm
    ctx.strokeStyle = '#5a1d1d';
    ctx.lineWidth = 2.4;
    ctx.beginPath();
    ctx.moveTo(0, -this.size * 0.72 + bob);
    ctx.lineTo(this.size * 0.82, -this.size * 0.76 + bob + clawSwing);
    ctx.stroke();
    // Razor talons
    ctx.strokeStyle = '#0d0d0d';
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    ctx.moveTo(this.size * 0.82, -this.size * 0.76 + bob + clawSwing);
    ctx.lineTo(this.size * 1.05, -this.size * 0.82 + bob + clawSwing);
    ctx.moveTo(this.size * 0.82, -this.size * 0.76 + bob + clawSwing);
    ctx.lineTo(this.size * 1.02, -this.size * 0.72 + bob + clawSwing);
    ctx.stroke();

    // Head lunging forward inside ragged hood
    ctx.fillStyle = '#6d2121';
    ctx.beginPath();
    ctx.arc(this.size * 0.25, -this.size * 0.96 + bob, this.size * 0.32, 0, Math.PI * 2);
    ctx.fill();

    // Glowing Red Eye-Trails (Dynamic predator motion-blur streak)
    for (let i = 1; i <= 4; i++) {
      const trailAlpha = 0.85 / i;
      ctx.save();
      ctx.globalAlpha = trailAlpha;
      ctx.fillStyle = '#ff0033';
      ctx.shadowColor = '#ff0033';
      ctx.shadowBlur = 6;
      ctx.beginPath();
      ctx.arc(this.size * 0.38 - i * 4.2, -this.size * 0.98 + bob, 2.0 * (1 - i * 0.15), 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    // Core blazing crimson eye with fiery white center
    ctx.fillStyle = '#ff0033';
    ctx.shadowColor = '#ff0033';
    ctx.shadowBlur = 8;
    ctx.beginPath();
    ctx.arc(this.size * 0.38, -this.size * 0.98 + bob, 2.2, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.arc(this.size * 0.4, -this.size * 0.98 + bob, 0.9, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;
  }

  // --- 3. RIOT ARMORED: Full SWAT ballistic helmet with cracked visor, heavy Kevlar armor plates that reflect light, riot knee pads ---
  drawRiotArmored(ctx, bob, legSwing) {
    // Heavy Tactical Legs & High-Impact Riot Knee Pads

    ctx.lineWidth = 3.6;
    ctx.beginPath();
    ctx.moveTo(-3, -this.size * 0.42);
    ctx.lineTo(-4 + legSwing, 0);
    ctx.moveTo(3, -this.size * 0.42);
    ctx.lineTo(4 - legSwing, 0);
    ctx.stroke();

    // Riot Knee Pads on both knees
    ctx.fillStyle = '#111417';
    ctx.fillRect(-5.5 + legSwing * 0.6, -this.size * 0.22, 4, 4);
    ctx.fillRect(1.5 - legSwing * 0.6, -this.size * 0.22, 4, 4);
    // Steel rivet studs on knee pads
    ctx.fillStyle = '#cbd5e1';
    ctx.fillRect(-4.5 + legSwing * 0.6, -this.size * 0.2, 1.2, 1.2);
